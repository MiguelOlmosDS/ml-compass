e, estimatorParamMaps=grid,\n                    evaluator=RegressionEvaluator(metricName='rmse'),\n                    numFolds=3, parallelism=2)\nfit = cv.fit(train_df)","lab":{"title":"Hands-on challenge: Spark ML at enterprise scale","task":"Implement a Spark ML regression pipeline with 2 hyperparameters, compare 3-fold evaluation, and describe how data skew affects execution.","solution":"Construct VectorAssembler + GBTRegressor, build a two-parameter grid, run CrossValidator on a realistic training split, evaluate held-out RMSE, inspect partition skew and model runtime. Do not collect the full training dataset to the driver.","checks":["Distributed estimator","Correct evaluation split","Shuffle and skew awareness"]},"minutes":50},{"id":"32","title":"Optuna, Ray, scaling & nested MLflow","track":"Databricks Professional","level":"Expert","domain":"pro_development","summary":"Understand distributed optimization, compute strategies and auditable experiment hierarchies.","concepts":[{"term":"Optuna distributed tuning","definition":"Optuna organizes studies and trials and can integrate trials with MLflow. The Databricks Professional guide references MLflow-backed study patterns; verify available Optuna and Databricks integration packages for your runtime.","example":"Compare independent trial outcomes while maintaining study metadata and traceability."},{"term":"Ray distributed execution","definition":"Ray schedules independent Python tasks and actors, enabling many training/tuning strategies. Spark and Ray solve overlapping but different scheduling problems; consider memory, serialization and team expertise.","example":"Use Ray Tune when training library supports Python-level parallel trials."},{"term":"Data vs model parallelism","definition":"Data parallelism processes partitions or mini-batches of training data in parallel with model-state synchronization; model parallelism partitions large model components across devices.","example":"Train the same network on multiple GPUs via data-parallel gradients; shard a huge network by layers for model parallelism."},{"term":"Vertical vs horizontal scaling","definition":"Vertical scaling adds resources to a node; horizontal scaling adds more nodes and overhead. Speedup depends on algorithm support, network and coordination.","example":"A memory-heavy single estimator may benefit from more RAM, not more Spark workers."},{"term":"MLflow nested runs","definition":"A parent run represents a tuning study; nested child runs represent candidate configurations. Record aggregate fold metrics and the final selected model separately to keep comparisons clear.","example":"mlflow.start_run(nested=True) within a parent run."}],"code":"import mlflow\n# Illustrative nested MLflow runs; use actual candidate models in your notebook.\nwith mlflow.start_run(run_name='tuning_study'):\n    for depth in [3,5,7]:\n        with mlflow.start_run(run_name=f'depth_{depth}', nested=True):\n            mlflow.log_param('max_depth',depth)\n            # score = evaluate_with_cv(depth)\n            # mlflow.log_metric('cv_rmse',score)\n# For distributed Optuna/Ray setup, consult current runtime docs.","lab":{"title":"Hands-on challenge: Optuna, Ray, scaling & nested MLflow","task":"Design a distributed hyperparameter study with 40 trials, nested MLflow logging and a deployment-ready best model.","solution":"Allocate resources per trial, choose Ray/Optuna according to library/runtime, log parent+child MLflow runs with split/version, evaluate every trial against the same validation protocol, refit the chosen configuration, register only after independent quality checks.","checks":["Separate trial and final evaluation","Avoid resource oversubscription","Track nesting and environment"]},"minutes":50},{"id":"33","title":"Point-in-time feature pipelines & online feature serving","track":"Databricks Professional","level":"Expert","domain":"pro_development","summary":"Build reliable training-time, streaming and low-latency feature paths.","concepts":[{"term":"Point-in-time feature consistency","definition":"For historical labeled examples, the correct feature record is the latest one available by each label's prediction timestamp. Plain joins to a current feature table are unsafe for historical training.","example":"Fraud labels timestamped Tuesday must not see customer metrics calculated on Friday."},{"term":"Automated feature pipelines","definition":"Compute features through scheduled or streaming data pipelines, validate freshness, persist governed feature definitions and track lineage. Optimize for idempotent recovery.","example":"Hourly aggregations update a UC feature table from a Delta stream."},{"term":"Online tables and synchronization","definition":"Online feature representations serve keyed lookups at low latency. Design primary keys, refresh cadence, and consistent semantics relative to offline training. Supported APIs evolve, so confirm current Databricks SDK names.","example":"Customer-level 5-minute spend features become available to an online transaction endpoint."},{"term":"On-demand feature computation","definition":"Some features are derived dynamically from request inputs at inference rather than materialized offline. Keep definitions consistent and test edge cases.","example":"Calculate the ratio of requested amount to known credit limit at prediction time."},{"term":"Streaming feature engineering","definition":"Process event-time windows, late arrivals and watermarking to avoid incorrect aggregates. Validate the cutoff used by the prediction.","example":"A 10-minute anomaly feature must define whether late telemetry is allowed and how much delay is tolerated."}],"code":"# Conceptual point-in-time join in SQL:\nSELECT l.entity_id, l.label_time, l.label, f.feature_value\nFROM labels l\nLEFT JOIN features f ON l.entity_id = f.entity_id\n AND f.feature_time <= l.label_time\nQUALIFY ROW_NUMBER() OVER (\n  PARTITION BY l.entity_id, l.label_time\n  ORDER BY f.feature_time DESC NULLS LAST\n) = 1;\n-- Ensure label rows have a unique identifier if timestamps collide.","lab":{"title":"Hands-on challenge: Point-in-time feature pipelines & online feature serving","task":"Specify point-in-time correctness tests for a transaction-level feature table with late-arriving events and online serving.","solution":"Create historical labels with unique row keys, join latest eligible features by cutoff, assert no feature timestamp exceeds prediction time, test duplicate keys and missing online records, and compare training/serving calculations on shared examples.","checks":["Correct temporal semantics","Primary keys and collisions","Online/offline parity"]},"minutes":50},{"id":"34","title":"ML lifecycle testing & deployment environments","track":"Databricks Professional","level":"Expert","domain":"pro_ops","summary":"Design testable training systems and environment-as-code releases.","concepts":[{"term":"Unit vs integration tests","definition":"Unit tests verify isolated feature/model helper functions. Integration tests exercise interactions between data processing, training, evaluation, registry and serving. Define which tests rerun after each change type.","example":"A modified model hyperparameter can require training/evaluation/deployment integration checks."},{"term":"Databricks deployment bundles","definition":"The exam guide uses Databricks Asset Bundles (DABs); newer product docs call them Declarative Automation Bundles. Version resource configurations for Jobs, experiments, registered models and endpoints.","example":"One YAML configuration deploys dev, staging and prod with environment-specific targets."},{"term":"Deploy-code vs deploy-model","definition":"Deploy-code reruns reproducible training/registration in destination environments; deploy-model moves an approved immutable artifact when governance allows. Each has tradeoffs involving infrastructure and data access.","example":"Rebuild models on restricted production data or deploy an evaluated artifact across environments."},{"term":"Test boundaries and contracts","definition":"Check input schema, target rules, feature engineering and scoring response formats before release. Include smoke tests and model-contract tests for serving.","example":"Failing when a training label column disappears prevents downstream corrupt deployment."},{"term":"Secrets and identity","definition":"Isolate permissions per environment and never hard-code credentials in notebooks or bundle files. Use identity-based access and least privilege.","example":"Service principal for production Job can read an approved catalog but not staging secrets."}],"code":"# Simplified Databricks bundle configuration illustration:\nbundle:\n  name: ml-production\nresources:\n  jobs:\n    training_job:\n      name: training-job\n      tasks:\n        - task_key: validate_data\n          notebook_task:\n            notebook_path: ./notebooks/validate.py\n# Actual complete configuration depends on CLI/runtime version.","lab":{"title":"Hands-on challenge: ML lifecycle testing & deployment environments","task":"Define a CI/CD test matrix across dev/staging/prod for data features, training, registration and serving.","solution":"Unit test feature helpers in CI; integration-test feature-train-evaluate contracts in staging; verify governed UC permissions and endpoint request/response; run smoke/canary checks in prod with rollback readiness. Store bundle config in version control.","checks":["Separate unit/integration","Environment-specific approvals","Least privilege"]},"minutes":50},{"id":"35","title":"Lakehouse monitoring, drift & automatic retraining","track":"Databricks Professional","level":"Expert","domain":"pro_ops","summary":"Learn drift monitors, inference tables, baselines and retraining gates.","concepts":[{"term":"Lakehouse Monitoring table types","definition":"Snapshot monitors describe an evolving table, time-series monitors analyze data over timestamp slices, and inference-profile monitors support predictions and ground-truth metrics. Select a profile matching the use case.","example":"Compare model scores over weeks using an inference table with labels arriving later."},{"term":"Numerical and categorical drift","definition":"Quantitative measures such as PSI, KS statistics and distribution comparisons reveal change; categorical frequency shifts need appropriate comparisons. Statistical significance alone is not business impact.","example":"Detect new customer-region composition and price distribution drift from baseline."},{"term":"Baseline and granularity","definition":"Compare current data to a fixed reference or successive windows; monitor by time and meaningful cohorts. Tiny cohorts yield noisy alerts.","example":"Track weekly order-error changes by country, product family and client tier."},{"term":"Automated retraining triggers","definition":"Drift or performance alerts can start an approved retraining workflow, but a new model must still pass validation and champion comparison before promotion.","example":"If post-label MAE rises 20% across 3 weeks, trigger a candidate retrain."},{"term":"Inference logging","definition":"Prediction tables ideally include request identifiers, timestamps, feature/model versions and eventual labels. Without reliable joins and delayed labels, model quality monitoring can be misleading.","example":"Join predicted weekly units to actual next-week demand after outcomes arrive."}],"code":"# Simplified monitoring-oriented inference data schema:\n# request_id | scored_at | model_version | prediction | label\n# entity_id  | feature_snapshot_id | traffic_arm\n# Use a governed Delta inference table and configure monitor profiles\n# using the current Databricks SDK/API documented for your workspace.","lab":{"title":"Hands-on challenge: Lakehouse monitoring, drift & automatic retraining","task":"Design a Lakehouse monitor and retraining trigger for a production weekly sales model; distinguish signal from automatic rollout.","solution":"Log inference rows and late actuals with model version, monitor cohort-level MAE/bias and input drift, compare to a stable reference, trigger retraining when repeated significant degradation appears, and deploy only if candidate passes holdout and guardrail checks.","checks":["Correct monitor profile","Delayed labels","Gate retraining vs promotion"]},"minutes":50},{"id":"36","title":"Production observability, slicing & incident response","track":"Databricks Professional","level":"Expert","domain":"pro_ops","summary":"Go beyond aggregate metrics to operational and statistical diagnosis.","concepts":[{"term":"Endpoint health metrics","definition":"Track request latency, throughput, timeout/error rates, CPU and memory pressure. A predictive model can be statistically accurate but operationally unusable.","example":"P95 latency breaches 200ms after a model rollout."},{"term":"Metric slicing","definition":"Aggregate quality hides pockets of poor performance. Slice by region, device, client tier and data freshness, while guarding against unstable tiny samples.","example":"Overall recall holds steady but declines sharply in one distribution center."},{"term":"Custom monitor metrics","definition":"Define domain-specific statistics that connect predictions to outcomes, such as stockout avoidance, capacity use or margin loss, not just generic drift scores.","example":"Monitor fulfillment-adjusted absolute order error by category."},{"term":"Alert design & incident triage","definition":"Alerts should specify thresholds, minimum sample sizes, owners and response actions. Investigate data pipelines and serving health before reflexively retraining.","example":"A sudden null-price spike points to upstream ingestion, not necessarily a stale model."},{"term":"Shadow / canary evidence","definition":"Shadow deployment scores without controlling decisions; canary sends a small live traffic fraction to the new model. Compare compatible cohorts and monitor quality and reliability.","example":"Route 5% of eligible traffic to a challenger, then expand only after guardrails pass."}],"code":"# Example quality slicing in Spark:\nfrom pyspark.sql import functions as F\nobservations = spark.table('main.ml.inference_log')\nquality = (observations.where(F.col('actual').isNotNull())\n    .groupBy('region','model_version')\n    .agg(F.count('*').alias('n'),\n         F.avg(F.abs(F.col('actual')-F.col('prediction'))).alias('mae')))\nquality.where(F.col('n')>=100).show()","lab":{"title":"Hands-on challenge: Production observability, slicing & incident response","task":"Build an incident runbook for high endpoint latency and deteriorating MAE in one region.","solution":"Validate serving P50/P95/5xx/CPU, model version and region routing; investigate data freshness and price normalization; slice errors with adequate sample counts; compare champion/canary, mitigate traffic and roll back if warranted; escalate with traceable logs.","checks":["Operational and ML metrics","Slice with sample sizes","Runbook/rollback"]},"minutes":50},{"id":"37","title":"Custom PyFunc serving, canary and blue–green deployment","track":"Databricks Professional","level":"Expert","domain":"pro_deployment","summary":"Deploy custom model objects and release them safely through supported serving APIs.","concepts":[{"term":"Custom MLflow PyFunc model","definition":"A PythonModel encapsulates custom loading and predict logic under MLflow's pyfunc interface. Package code, artifacts, model signature and dependencies to make serving reproducible.","example":"A custom scoring model loads a preprocessor and demand estimator as one artifact."},{"term":"Model Serving endpoint configuration","definition":"A model serving endpoint references served entities/models and allocates compute and traffic. Choose concurrency and scaling for request rate and latency requirements.","example":"Two model versions share a serving endpoint during a gradual rollout."},{"term":"Canary vs blue–green","definition":"Canary incrementally routes a small fraction of real traffic to a challenger; blue–green prepares a parallel full environment and switches traffic after validation. Shadow traffic does not control user decisions.","example":"Start at 5% canary, then 25%, 50% and 100% with quality gates."},{"term":"REST API and MLflow Deployments SDK","definition":"Authenticate correctly and submit structured inference payloads. MLflow Deployments SDK can query serving endpoints; check latest endpoint schema and SDK semantics.","example":"client.predict(endpoint='...', inputs=payload) under supported MLflow versions."},{"term":"Rollback and traffic observability","definition":"Pin stable approved versions, compare request errors and business outcomes, and preserve an immediate rollback lever. Watch route optimization and scale-out settings for high throughput.","example":"Reassign 100% traffic to previous served entity if challenger latency degrades."}],"code":"import mlflow.pyfunc\n\nclass DemandPyFunc(mlflow.pyfunc.PythonModel):\n    def load_context(self, context):\n        import joblib\n        self.model = joblib.load(context.artifacts['model_file'])\n    def predict(self, context, model_input, params=None):\n        return self.model.predict(model_input)\n# Log with mlflow.pyfunc.log_model(..., python_model=DemandPyFunc(),\n#  artifacts={'model_file': 'model.pkl'}, signature=...)\n# Validate current MLflow API arguments and secure UC registration.","lab":{"title":"Hands-on challenge: Custom PyFunc serving, canary and blue–green deployment","task":"Design a safe rollout for a high-traffic custom PyFunc endpoint including traffic-split guardrails and rollback.","solution":"Register a signed custom PyFunc model in UC, validate artifacts/schema, deploy second served entity, start at a small canary percentage, monitor latency/error/correctness, progressively ramp traffic and revert to champion immediately on breached thresholds.","checks":["PyFunc artifacts and signature","Controlled rollout","Rollback procedure"]},"minutes":50}];
const QUESTIONS = [{"id":"q001","module":"01","domain":null,"kind":"theory","prompt":"Which artifact describes the outcome a model should predict?","options":["Target variable","Training seed","Feature scale","Batch size"],"answer":[0],"explanation":"The target y is the outcome to predict; X contains only available inputs."},{"id":"q002","module":"01","domain":null,"kind":"theory","prompt":"A store wants recommendations every Monday. Which feature is unsafe?","options":["Actual sales from the following week","Last week's sales","Current known price","Announced promotions"],"answer":[0],"explanation":"Future realized sales cannot be available when Monday recommendations are generated."},{"id":"q003","module":"01","domain":null,"kind":"theory","prompt":"What should be evaluated before comparing advanced algorithms?","options":["A simple baseline","Feature importance chart","The final production API","An embedding database"],"answer":[0],"explanation":"A baseline establishes whether complexity yields meaningful improvement."},{"id":"q004","module":"01","domain":null,"kind":"theory","prompt":"A model selects a candidate using the held-out test set repeatedly. What failed?","options":["Test-set independence","CPU parallelism","Train data size","Score normalization"],"answer":[0],"explanation":"Repeated choices on the test set overfit the reported generalization estimate."},{"id":"q005","module":"02","domain":null,"kind":"theory","prompt":"What does vectorization usually replace?","options":["Python loops over individual array elements","Cross-validation folds","Data validation","Feature-store governance"],"answer":[0],"explanation":"Vectorized NumPy/pandas operations operate on arrays/columns rather than repeated Python-level element loops."},{"id":"q006","module":"02","domain":null,"kind":"theory","prompt":"What does df.loc[mask].copy() help with?","options":["Making an independent DataFrame for subsequent modifications","Sorting rows automatically","Removing all null v ata?","options":["Explained feature variance","Target ROC-AUC directly","Number of labels","Number of unique categories"],"answer":[0],"explanation":"Unsupervised PCA optimizes variance captured, not downstream prediction quality."},{"id":"q013","module":"04","domain":null,"kind":"theory","prompt":"For [1,2,3,4,100], which statistic is least affected by 100?","options":["Median","Mean","Variance","Range"],"answer":[0],"explanation":"Median reflects the middle value, while mean, variance and range respond strongly to the large observation."},{"id":"q014","module":"04","domain":null,"kind":"theory","prompt":"A dataset has 1% positives. A classifier has a high false-positive rate. Why might precision still be low?","options":["Low base-rate prevalence","Large number of input columns","High recall necessarily means perfect precision","Zero model coefficients"],"answer":[0],"explanation":"Positive predictive value depends on base rates and the volume of false positives."},{"id":"q015","module":"04","domain":null,"kind":"theory","prompt":"What does a 95% frequentist confidence interval generally mean?","options":["The procedure covers the fixed parameter in 95% of repeated samples","95% of observed rows fall within the interval","The observed fixed parameter has 95% probability of lying within it","The model has 95% accuracy"],"answer":[0],"explanation":"Confidence is a repeated-sampling coverage property under assumptions."},{"id":"q016","module":"04","domain":null,"kind":"theory","prompt":"What units does standard deviation have?","options":["The same as the original variable","Squared units","No units regardless of input","Percent only"],"answer":[0],"explanation":"Standard deviation is the square root of variance, restoring the input units."},{"id":"q017","module":"05","domain":null,"kind":"theory","prompt":"A p-value of .03 means what?","options":["Under the null, equally or more extreme results occur with probability .03","The null hypothesis has a 3% probability of being true","The experiment has 97% business lift","The effect is necessarily large"],"answer":[0],"explanation":"P-values quantify tail probabilities under H0 and its assumptions."},{"id":"q018","module":"05","domain":null,"kind":"theory","prompt":"Failing to detect a real effect is which error?","options":["Type II error","Type I error","Train-serving skew","Data leakage"],"answer":[0],"explanation":"A false negative statistical conclusion is a Type II error."},{"id":"q019","module":"05","domain":null,"kind":"theory","prompt":"An A/B test is statistically significant but lift is too small to cover rollout costs. What matters?","options":["Practical significance and effect size","Only the smallest p-value","Increasing model complexity","Ignoring the confidence interval"],"answer":[0],"explanation":"Decisions must consider benefit magnitude, uncertainty and cost."},{"id":"q020","module":"05","domain":null,"kind":"theory","prompt":"Testing 50 metrics and reporting just the best one increases what?","options":["False discovery risk","Model fairness automatically","Test sample size","Gradient stability"],"answer":[0],"explanation":"Multiple uncorrected comparisons create more opportunities for false positives."},{"id":"q021","module":"06","domain":null,"kind":"theory","prompt":"Joining 1 row per store-week to 3 rows per store-week without aggregation may cause what?","options":["Row multiplication and inflated sums","Correct weighted averages by default","Removal of duplicates by SQL","Stable one-to-one grain"],"answer":[0],"explanation":"A one-to-many join repeats fact rows and can inflate aggregates."},{"id":"q022","module":"06","domain":null,"kind":"theory","prompt":"Which SQL expression retrieves a previous week's sales inside each SKU?","options":["LAG(units) OVER (PARTITION BY sku ORDER BY week)","SUM(units) OVER ()","COUNT(*) GROUP BY sku","ROW_NUMBER() OVER (ORDER BY units DESC)"],"answer":[0],"explanation":"LAG with partition and chronological order yields preceding observations."},{"id":"q023","module":"06","domain":null,"kind":"theory","prompt":"Which SQL test detects missing values?","options":["column IS NULL","column = NULL","column == NaN","column IN NULL"],"answer":[0],"explanation":"SQL NULL is checked with IS NULL and participates in three-valued logic."},{"id":"q024","module":"06","domain":null,"kind":"theory","prompt":"A table has 20 rows, and 5 NULL price values. What is COUNT(price)?","options":["15","20","5","NULL"],"answer":[0],"explanation":"COUNT(column) ignores NULL; COUNT(*) counts rows."},{"id":"q025","module":"07","domain":"processing","kind":"theory","prompt":"Which plot best shows a numeric feature's distribution?","options":["Histogram","Pie chart of every observation","Entity relation diagram","ROC curve without predictions"],"answer":[0],"explanation":"A histogram shows frequency across numeric bins."},{"id":"q026","module":"07","domain":"processing","kind":"theory","prompt":"You want to compare two categorical features. Best starting point?","options":["Contingency table / count heatmap","Pearson correlation only","Scatterplot of integer codes as continuous values","RMSE calculation"],"answer":[0],"explanation":"Crosstabs reflect joint categorical frequencies."},{"id":"q027","module":"07","domain":"processing","kind":"theory","prompt":"How can you summarize a huge Spark DataFrame without moving all rows to the driver?","options":["df.summary().show()","df.collect() then pandas.describe()","Convert to a Python list","Download all partitions"],"answer":[0],"explanation":"Spark summary performs distributed aggregations; collect can exhaust driver memory."},{"id":"q028","module":"07","domain":"processing","kind":"theory","prompt":"A high correlation between discounts and sales proves discounts caused additional sales.","options":["False; confounding and reverse causality remain possible","True by definition","True if p is below .05","True only with a histogram"],"answer":[0],"explanation":"Association alone cannot establish an intervention effect."},{"id":"q029","module":"08","domain":"processing","kind":"theory","prompt":"A numeric feature is strongly right-skewed. Which basic imputation is often more robust?","options":["Median","Mean always","New random ID","String one-hot encoding"],"answer":[0],"explanation":"Median is less distorted by extreme positive values."},{"id":"q030","module":"08","domain":"processing","kind":"theory","prompt":"With Q1=10 and Q3=30, what is the conventional 1.5*IQR upper fence?","options":["60","40","20","90"],"answer":[0],"explanation":"IQR=20, upper fence=30+1.5*20=60."},{"id":"q031","module":"08","domain":"processing","kind":"theory","prompt":"Why must you fit a median imputer inside each training fold?","options":["To prevent validation information entering preprocessing","To maximize test-set access","To create more labels","To force all models to be linear"],"answer":[0],"explanation":"Preprocessing estimated on all rows leaks validation-distribution information."},{"id":"q032","module":"08","domain":"processing","kind":"theory","prompt":"A model was trained on log1p(y). How do you return predictions to the original y scale?","options":["np.expm1(pred_log)","np.log1p(pred_log)","np.sqrt(pred_log)","pred_log / 2"],"answer":[0],"explanation":"np.expm1 is the inverse of np.log1p, subject to modeling/bias considerations."},{"id":"q033","module":"09","domain":"processing","kind":"theory","prompt":"A categorical variable contains country names with no natural order. Typical linear-model encoding?","options":["OneHotEncoder","Integer codes 1,2,3 as meaningful distance","Z-score of string names","Taking the logarithm of country"],"answer":[0],"explanation":"One-hot avoids imposing a fake numeric ordering on nominal categories."},{"id":"q034","module":"09","domain":"processing","kind":"theory","prompt":"What should OneHotEncoder(handle_unknown='ignore') do for a never-seen category at transform time?","options":["Avoid an exception by encoding it as all zeros for that feature group","Retrain the entire model automatically","Predict the label directly","Delete all test rows"],"answer":[0],"explanation":"Ignoring unknowns prevents errors; unknown representation is zero across the corresponding one-hot category columns."},{"id":"q035","module":"09","domain":"processing","kind":"theory","prompt":"Which models are especially sensitive to unscaled feature magnitude?","options":["Distance-based methods and SVM","Ordinary decision trees typically","Rule-based text filters only","Category-only lookup tables"],"answer":[0],"explanation":"Distance and margin calculations depend strongly on numeric feature scale."},{"id":"q036","module":"09","domain":"processing","kind":"theory","prompt":"Why is naive target encoding of all data before train/test split dangerous?","options":["Labels leak into encoded features","It always creates too many columns","It removes every category","It prevents class imbalance"],"answer":[0],"explanation":"Target means must be learned safely within folds to avoid leakage."},{"id":"q037","module":"10","domain":"development","kind":"theory","prompt":"For next-week demand forecasting, best default split?","options":["Chronological train/validation/test","Randomly shuffle all weeks","Select weeks with highest sales for test","Train using future weeks and test the past"],"answer":[0],"explanation":"Future predictions should be simulated using past-only information."},{"id":"q038","module":"10","domain":"development","kind":"theory","prompt":"Which splitter keeps observations from the same retailer together?","options":["GroupKFold","Plain KFold with shuffle","StandardScaler","RandomForestRegressor"],"answer":[0],"explanation":"GroupKFold creates non-overlapping groups across folds."},{"id":"q039","module":"10","domain":"development","kind":"theory","prompt":"What is a typical cross-validation tradeoff?","options":["More stable performance estimate but more model fits","No additional computation","Guaranteed no distribution shift","Permission to tune on the test set"],"answer":[0],"explanation":"K-fold trains repeatedly and still requires appropriate fold strategy."},{"id":"q040","module":"10","domain":"development","kind":"theory","prompt":"A rolling feature calculated with center=True for next-week forecasting is risky because it may use what?","options":["Future values","Only training samples","Earlier labels exclusively","No input data"],"answer":[0],"explanation":"Centered windows include future observations relative to current timestamp."},{"id":"q041","module":"11","domain":"development","kind":"theory","prompt":"Which model is a suitable simple numeric-target baseline?","options":["LinearRegression","KMeans","PCA","LogisticRegression as a regressor"],"answer":[0],"explanation":"Linear regression is a simple supervised baseline for continuous targets."},{"id":"q042","module":"11","domain":"development","kind":"theory","prompt":"Which target predictor minimizes expected squared error under usual point-estimate assumptions?","options":["Conditional mean","Conditional median always","Most frequent string category","Random classifier"],"answer":[0],"explanation":"The conditional mean minimizes expected squared loss."},{"id":"q043","module":"11","domain":"development","kind":"theory","prompt":"What is a typical downside of a very deep unpruned regression tree?","options":["High variance / overfitting","Guaranteed lower test error","No nonlinear behavior","Loss of all features"],"answer":[0],"explanation":"Complex trees can memorize patterns and generalize poorly."},{"id":"q044","module":"11","domain":"development","kind":"theory","prompt":"When is RMSE preferred to MAE?","options":["When large errors should be penalized more strongly","When every error should have linear cost","When labels are text classes","When zero error is guaranteed"],"answer":[0],"explanation":"Squaring emphasizes large misses relative to MAE."},{"id":"q045","module":"12","domain":"development","kind":"theory","prompt":"Logistic regression primarily models what?","options":["Class probability via log odds","A continuous target using least squares only","Cluster memberships without labels","The number of pandas columns"],"answer":[0],"explanation":"Logistic regression produces class probabilities through a logistic link."},{"id":"q046","module":"12","domain":"development","kind":"theory","prompt":"A threshold of 0.5 is always optimal for fraud detection.","options":["False; choose using costs and validated precision/recall","True when classes are imbalanced","True when labels are numbers","True when ROC-AUC is high"],"answer":[0],"explanation":"A decision threshold depends on prevalence, business costs and operating capacity."},{"id":"q047","module":"12","domain":"development","kind":"theory","prompt":"What does probability calibration mean for predicted scores near .8?","options":["About 80% of comparable cases are positive over many observations","The classifier is 80% accurate on all rows","The recall is fixed at .8","The model cannot make false positives"],"answer":[0],"explanation":"A calibrated probability agrees with observed event frequencies."},{"id":"q048","module":"12","domain":"development","kind":"theory","prompt":"Which problem permits several labels per observation?","options":["Multilabel classification","Multiclass single-label classification","Univariate regression","PCA reconstruction"],"answer":[0],"explanation":"Multilabel tasks allow multiple active outcomes for one sample."},{"id":"q049","module":"13","domain":"development","kind":"theory","prompt":"TP=30, FP=10, FN=20. What is precision?","options":["0.75","0.60","0.50","0.90"],"answer":[0],"explanation":"Precision=TP/(TP+FP)=30/40=0.75."},{"id":"q050","module":"13","domain":"development","kind":"theory","prompt":"TP=30, FP=10, FN=20. What is recall?","options":["0.60","0.75","0.40","0.95"],"answer":[0],"explanation":"Recall=TP/(TP+FN)=30/50=0.60."},{"id":"q051","module":"13","domain":"development","kind":"theory","prompt":"Which metric often exposes rare-positive class ranking better than accuracy?","options":["Average precision / PR-AUC","R-squared","MAPE on probabilities","Sum of feature coefficients"],"answer":[0],"explanation":"Precision-recall methods focus on positive-class performance under imbalance."},{"id":"q052","module":"13","domain":"development","kind":"theory","prompt":"Why can R² be negative on test data?","options":["Predictions are worse in squared error than the test target mean baseline","Because negative labels are forbidden","Because loss is always negative","Because there are no features"],"answer":[0],"explanation":"R²=1-SSE/SST and SSE can exceed SST on out-of-sample data."},{"id":"q053","module":"14","domain":"development","kind":"theory","prompt":"In sklearn, what does the transform() method indicate?","options":["A Transformer that changes feature representations","A model that must have predict_proba","A SQL aggregator","A hyperparameter-search result"],"answer":[0],"explanation":"Transformers map input data to transformed data after appropriate fitting."},{"id":"q054","module":"14","domain":"development","kind":"theory","prompt":"A grid contains 2 depths and 4 learning rates, with 3 CV folds. How many CV fits?","options":["24","9","8","12"],"answer":[0],"explanation":"Cartesian combinations 2*4=8; times 3 folds gives 24 fits before refit."},{"id":"q055","module":"14","domain":"development","kind":"theory","prompt":"Why use sklearn Pipeline in cross-validation?","options":["Fold-specific preprocessing helps prevent leakage","It prevents all overfitting automatically","It makes an unlabelled target","It always uses a GPU"],"answer":[0],"explanation":"Pipeline fits transformations separately within each training fold."},{"id":"q056","module":"14","domain":"development","kind":"theory","prompt":"What is true of StratifiedKFold?","options":["It approximately preserves class balance between folds","It guarantees chronological order","It keeps user groups intact automatically","It removes the need for validation"],"answer":[0],"explanation":"Stratification addresses label proportions; time and group structure need separate care."},{"id":"q057","module":"15","domain":"development","kind":"theory","prompt":"Which is a hyperparameter rather than a learned coefficient?","options":["max_depth","Trained tree threshold","Logistic regression fitted weight","Cluster centroid fitted from training"],"answer":[0],"explanation":"max_depth is chosen in model configuration before fitting."},{"id":"q058","module":"15","domain":"development","kind":"theory","prompt":"What does hyperopt.fmin minimize by default?","options":["User-supplied objective loss","Maximum ROC-AUC without conversion","Automatically selected business revenue","Every possible metric at once"],"answer":[0],"explanation":"Objective must return a scalar loss or dict with loss/status; maximize by negating or transforming desired score."},{"id":"q059","module":"15","domain":"development","kind":"theory","prompt":"Why might random search be useful in a large parameter space?","options":["It samples more distinct values of influential parameters per fixed budget","It evaluates every Cartesian combination","It eliminates validation needs","It guarantees a global optimum"],"answer":[0],"explanation":"Random search spends a trial budget across broadly sampled configurations."},{"id":"q060","module":"15","domain":"development","kind":"theory","prompt":"Which search method builds a surrogate model from past trials to select next candidates?","options":["Bayesian optimization","Exhaustive grid search","Simple random split","KMeans clustering"],"answer":[0],"explanation":"Bayesian strategies use evaluation history to propose promising trials."},{"id":"q061","module":"16","domain":"development","kind":"theory","prompt":"A classifier predicts all-negative on a 99%-negative dataset. Accuracy?","options":["99%","50%","1%","0%"],"answer":[0],"explanation":"Majority-class prediction can look accurate while recall on the rare class is zero."},{"id":"q062","module":"16","domain":"development","kind":"theory","prompt":"Where should synthetic oversampling such as SMOTE be applied?","options":["Inside training folds only","Before train/test splitting","Directly to the test set","After scoring the production labels"],"answer":[0],"explanation":"Resampling ahead of splitting creates related records in multiple folds and leaks information."},{"id":"q063","module":"16","domain":"development","kind":"theory","prompt":"What is cost-sensitive learning?","options":["Higher penalty for costly minority-class errors","Eliminating all false positives mathematically","Standardizing numeric variables","Dropping every majority-class row"],"answer":[0],"explanation":"Weighted losses can change the objective to emphasize important error types."},{"id":"q064","module":"16","domain":"development","kind":"theory","prompt":"Which metric offers a better rare-event ranking check than raw accuracy?","options":["PR-AUC / average precision","R²","Explained variance of raw features","PCA silhouette"],"answer":[0],"explanation":"Precision-recall performance makes the positive event quality visible."},{"id":"q065","module":"17","domain":"development","kind":"theory","prompt":"Train error is very low and validation error high. Likely issue?","options":["High variance / overfitting","Guaranteed underfitting","Perfect calibration","No model bias or variance"],"answer":[0],"explanation":"Strong train-validation gap indicates a model that fits training idiosyncrasies."},{"id":"q066","module":"17","domain":"development","kind":"theory","prompt":"Random Forest is an example of which ensemble style?","options":["Bagging / aggregation of varied trees","Sequential boosting only","Pure linear regression","Unsupervised matrix factorization"],"answer":[0],"explanation":"Random forests build varied trees using bootstrap and feature randomness and aggregate predictions."},{"id":"q067","module":"17","domain":"development","kind":"theory","prompt":"Why can impurity-based importance be misleading?","options":["It may favor high-cardinality features","It always proves causality","It is identical to Shapley attributions","It requires unlabeled features"],"answer":[0],"explanation":"Split-based importance can be biased by feature cardinality and correlated inputs."},{"id":"q068","module":"17","domain":"development","kind":"theory","prompt":"Can a SHAP value alone prove the causal effect of changing a feature?","options":["No, predictive attribution is not causal intervention","Yes, always","Yes if the value is positive","Yes only for random forests"],"answer":[0],"explanation":"SHAP explains a prediction relative to a reference and modeling assumptions, not automatic causality."},{"id":"q069","module":"18","domain":null,"kind":"theory","prompt":"What does KMeans optimize?","options":["Within-cluster squared distances","Classification log loss","Time-series autocorrelation","Regression R² on target labels"],"answer":[0],"explanation":"KMeans iteratively updates assignments and centers to reduce inertia."},{"id":"q070","module":"18","domain":null,"kind":"theory","prompt":"Which clustering method can label points as noise?","options":["DBSCAN","Ordinary PCA","MinMaxScaler","LogisticRegression"],"answer":[0],"explanation":"DBSCAN labels insufficiently dense points as noise."},{"id":"q071","module":"18","domain":null,"kind":"theory","prompt":"Why standardize input before KMeans?","options":["Distances are influenced by feature scale","KMeans always requires labels","It removes the need to choose k","It prevents all outliers"],"answer":[0],"explanation":"Without scaling one high-magnitude feature can dominate distances."},{"id":"q072","module":"18","domain":null,"kind":"theory","prompt":"What is a limitation of silhouette score?","options":["It can favor certain cluster geometries not matching the business task","It guarantees meaningful segments","It is the same as accuracy","It selects hyperparameters for any classifier automatically"],"answer":[0],"explanation":"Distance separation is only a proxy for useful clusters."},{"id":"q073","module":"19","domain":null,"kind":"theory","prompt":"What is a common error when building rolling demand features?","options":["Failing to shift before calculating historical averages","Sorting by event time","Using lagged demand","Comparing seasonal baselines"],"answer":[0],"explanation":"Unshifted rolling windows may include the current target at prediction time."},{"id":"q074","module":"19","domain":null,"kind":"theory","prompt":"Which validation best simulates repeated one-week forecasts?","options":["Walk-forward / rolling-origin backtesting","Random shuffle split","CV with future weeks in training","Fit-and-evaluate on same rows"],"answer":[0],"explanation":"Each backtest cutoff limits training to information available before the simulated prediction."},{"id":"q075","module":"19","domain":null,"kind":"theory","prompt":"What property characterizes intermittent demand?","options":["Many zero periods and occasional nonzero demand","Perfectly linear upward trend","Every week has identical positive sales","All forecasts equal labels"],"answer":[0],"explanation":"Sparse occurrence patterns require careful metrics and sometimes specialized models."},{"id":"q076","module":"19","domain":null,"kind":"theory","prompt":"Which error metric can be problematic when actual demand contains zeros?","options":["MAPE","MAE","RMSE","Median absolute error"],"answer":[0],"explanation":"Percentage error divides by actual and is undefined at zero."},{"id":"q077","module":"20","domain":null,"kind":"theory","prompt":"If 1,000 rows are processed with batch size 100, how many optimizer updates per full epoch (no drop-last)?","options":["10","100","1,000","1"],"answer":[0],"explanation":"1000/100=10 mini-batches."},{"id":"q078","module":"20","domain":null,"kind":"theory","prompt":"What is an embedding?","options":["A learned dense vector representation","A database join key only","A discrete model threshold","A guaranteed factual explanation"],"answer":[0],"explanation":"Embeddings encode learned similarities useful for tasks such as retrieval."},{"id":"q079","module":"20","domain":null,"kind":"theory","prompt":"What does a transformer attention mechanism broadly enable?","options":["Context-dependent interaction between sequence positions","Only decision-tree splits","Removal of all positional information automatically","SQL indexing"],"answer":[0],"explanation":"Attention mixes token representations based on context-dependent weights."},{"id":"q080","module":"20","domain":null,"kind":"theory","prompt":"Why use early stopping?","options":["Stop when held-out performance stops improving","Guarantee zero training loss","Remove the test set","Make weights exactly zero"],"answer":[0],"explanation":"Early stopping helps avoid overfitting after validation performance plateaus."},{"id":"q081","module":"21","domain":"processing","kind":"theory","prompt":"Which Spark operation triggers execution?","options":["df.count()","df.select('price')","df.filter('units > 0')","df.withColumn('x', expr)"],"answer":[0],"explanation":"count is an action; select, filter and withColumn are lazy transformations."},{"id":"q082","module":"21","domain":"processing","kind":"theory","prompt":"Why is df.collect() dangerous on huge tables?","options":["All collected rows move into driver memory","It creates balanced folds automatically","It enforces Unity Catalog permissions","It always compresses to 1 KB"],"answer":[0],"explanation":"Collect can exhaust driver memory and fail the process."},{"id":"q083","module":"21","domain":"processing","kind":"theory","prompt":"Which operation commonly causes a shuffle?","options":["groupBy on a distributed key","Selecting one field only","Renaming a column","Removing an unused alias"],"answer":[0],"explanation":"Grouped aggregations often require redistribution across partitions."},{"id":"q084","module":"21","domain":"processing","kind":"theory","prompt":"What provides Delta Lake with transaction semantics?","options":["Transaction log and ACID-aware operations","CSV headers alone","Pandas index","Random seeds"],"answer":[0],"explanation":"Delta's transaction log supports reliable versions and ACID properties."},{"id":"q085","module":"22","domain":"development","kind":"theory","prompt":"In Spark ML, LogisticRegression.fit(df) returns what?","options":["A fitted LogisticRegressionModel transformer","An untrained Estimator","A Python scalar loss only","The original unchanged dataset"],"answer":[0],"explanation":"An Estimator produces a fitted Model which can transform a Spark DataFrame."},{"id":"q086","module":"22","domain":"development","kind":"theory","prompt":"Which Spark ML stage creates the vector column expected by typical estimators?","options":["VectorAssembler","StringIndexer only","CrossValidator only","DataFrame.summary"],"answer":[0],"explanation":"VectorAssembler combines numeric columns and encoded vector columns into features."},{"id":"q087","module":"22","domain":"development","kind":"theory","prompt":"What does Pipeline.fit(training_df) produce?","options":["A PipelineModel with fitted stages","A Model Serving endpoint","A SQL warehouse","A raw pandas DataFrame"],"answer":[0],"explanation":"Fit trains Estimator stages and returns a transformable PipelineModel."},{"id":"q088","module":"22","domain":"development","kind":"theory","prompt":"Why choose handleInvalid='keep' with StringIndexer?","options":["Handle unseen/invalid categories during transform","Increase target sample size","Automatically optimize label threshold","Guarantee no null labels"],"answer":[0],"explanation":"It assigns an additional category index to invalid/unseen input categories."},{"id":"q089","module":"23","domain":"platform","kind":"theory","prompt":"What is a main benefit of Databricks ML runtime?","options":["Curated compatible ML libraries and integrations","Automatic proof of causality","Removing need for feature validation","Guaranteed free GPU"],"answer":[0],"explanation":"The ML runtime simplifies environment setup with bundled compatible libraries."},{"id":"q090","module":"23","domain":"platform","kind":"theory","prompt":"When using AutoML, which action is still essential?","options":["Validate leakage, data quality and baseline metrics","Accept its best trial as production without review","Skip test data","Ignore training labels"],"answer":[0],"explanation":"AutoML automates experimentation but cannot replace evaluation and domain checks."},{"id":"q091","module":"23","domain":"platform","kind":"theory","prompt":"A scikit-learn model runs slowly on a single node. Adding Spark workers automatically parallelizes sklearn.fit.","options":["False; algorithm/integration must support distributed execution","True for every sklearn estimator","True only on Sundays","True whenever MLflow logging is on"],"answer":[0],"explanation":"Single-node library training does not become distributed solely because extra workers exist."},{"id":"q092","module":"23","domain":"platform","kind":"theory","prompt":"Which is a sound MLOps practice?","options":["Version code, data and model artifacts with approval gates","Keep only an untracked notebook","Deploy every run regardless of quality","Ignore data lineage"],"answer":[0],"explanation":"Reproducibility and controlled release are central MLOps principles."},{"id":"q093","module":"23","domain":"platform","kind":"theory","prompt":"What should be inspected after AutoML generates candidate models?","options":["Validation strategies, generated notebooks and experiment metrics","Only dashboard color palette","Number of browser tabs","Current keyboard language"],"answer":[0],"explanation":"Generated training code and metrics must be reviewed to ensure the baseline is trustworthy."},{"id":"q094","module":"24","domain" ployment","kind":"theory","prompt":"What makes a pipeline task idempotent?","options":["Retrying it with identical inputs does not create unintended duplicate effects","It only runs once per month","It always uses a GPU","It ignores errors"],"answer":[0],"explanation":"Idempotent behavior supports safe retries and recovery."},{"id":"q115","module":"28","domain":"deployment","kind":"theory","prompt":"Which is most important in a model rollout?","options":["Monitoring, version pinning and rollback plan","Choosing a colorful chart","Deleting old model versions immediately","Sharing unrestricted credentials"],"answer":[0],"explanation":"Deployments require traceability and a recovery path."},{"id":"q116","module":"28","domain":"deployment","kind":"theory","prompt":"Why use least-privilege permissions for production jobs?","options":["Limit access and consequences of compromise or mistakes","Improve cross-validation automatically","Reduce training labels","Make all models causal"],"answer":[0],"explanation":"Authorization boundaries protect data/models and reduce blast radius."},{"id":"q117","module":"29","domain":null,"kind":"theory","prompt":"Feature distributions change, but label relationships appear stable. What is this?","options":["Data drift","Proven concept drift","Perfect calibration","Only a runtime issue"],"answer":[0],"explanation":"Data drift refers to changes in inputs; concept drift relates to predictive relationships."},{"id":"q118","module":"29","domain":null,"kind":"theory","prompt":"A live app converts prices with tax but training used pre-tax prices. This is what?","options":["Training-serving skew","Stratified sampling","Bayesian search","Correct metric normalization"],"answer":[0],"explanation":"The same semantic feature is constructed inconsistently in training and serving."},{"id":"q119","module":"29","domain":null,"kind":"theory","prompt":"Is newer retrained model always better for production?","options":["No; compare against current champion on validation and guardrails","Yes; timestamps guarantee quality","Yes if training cost is higher","Yes if dataset is larger"],"answer":[0],"explanation":"Retraining must be followed by objective quality and operational checks."},{"id":"q120","module":"29","domain":null,"kind":"theory","prompt":"Why may delayed ground-truth labels complicate model monitoring?","options":["True prediction accuracy cannot be observed immediately","Input drift is impossible","Endpoint latency cannot be measured","Models cannot generate predictions"],"answer":[0],"explanation":"Until outcomes arrive, monitoring relies on proxy/input/operational indicators."},{"id":"q121","module":"30","domain":null,"kind":"theory","prompt":"In RAG, what is the primary function of retrieval?","options":["Supply potentially relevant external context for generation","Guarantee the LLM cannot hallucinate","Retrain base model weights at each query","Replace all authorization checks"],"answer":[0],"explanation":"Retrieved passages ground generation but quality and security still require validation."},{"id":"q122","module":"30","domain":null,"kind":"theory","prompt":"Which metric tests whether relevant documents appear among top-k retrieved results?","options":["Recall@k","Regression MAE","Standard deviation of labels","Model size in MB"],"answer":[0],"explanation":"Recall@k evaluates relevant-document coverage of retrieved top-k."},{"id":"q123","module":"30","domain":null,"kind":"theory","prompt":"What is a prompt injection risk?","options":["Untrusted retrieved text tries to override instructions or tool-use boundaries","Normal user asks a permitted question","A vector is normalized","Model inference is batched"],"answer":[0],"explanation":"Documents and tool outputs may carry adversarial instructions and must remain untrusted data."},{"id":"q124","module":"30","domain":null,"kind":"theory","prompt":"A finance agent retrieves correct documents but gives unsupported numbers. What should you evaluate?","options" es probabilities to set prices. Prefer what?","options":["Assess calibration and economic loss","Choose arbitrary higher threshold 0.5","Only compare training accuracy","Use dimensionality reduction to force calibration"],"answer":[0],"explanation":"Probability quality matters when decisions use the magnitude of predicted risk."},{"id":"q153","module":"13","domain":"development","kind":"practical","prompt":"There are 10 positives out of 1,000 samples. The classifier predicts negative for all. Which pair is correct?","options":["Accuracy 99%, positive-class recall 0%","Accuracy 0%, recall 99%","Accuracy 100%, recall 100%","Accuracy 50%, recall 50%"],"answer":[0],"explanation":"990 TN and 10 FN imply accuracy 990/1000 and recall 0/10."},{"id":"q154","module":"14","domain":"development","kind":"practical","prompt":"Two values for C and three solvers are tested with 4 CV folds and default refit. How many fits including refit?","options":["25","24","6","9"],"answer":[0],"explanation":"2*3*4=24 CV fits plus final refit is 25, assuming compatible combinations."},{"id":"q155","module":"15","domain":"development","kind":"practical","prompt":"Your objective function returns negative AUC as the loss for Hyperopt. Why?","options":["fmin minimizes, so minimizing -AUC maximizes AUC","Hyperopt always maximizes the raw metric","AUC cannot be used in tuning","Negative AUC is a class imbalance correction"],"answer":[0],"explanation":"For a maximizing score, negate its value to create a minimization objective."},{"id":"q156","module":"16","domain":"development","kind":"practical","prompt":"SMOTE is applied to full data then the train/test split is formed. What is wrong?","options":["Synthetic points can leak information across split boundaries","SMOTE is impossible on numerics","SMOTE necessarily reduces recall to zero","There is no problem if random_state is set"],"answer":[0],"explanation":"Resampling must happen after splitting and within CV folds."},{"id":"q157","module":"17","domain":"development","kind":"practical","prompt":"A boosted tree has train RMSE=0.2 and validation RMSE=9.0. Which first intervention is sensible?","options":["Check leakage/split and reduce model complexity","Add unlimited tree depth","Evaluate on training only","Increase leakage from future target"],"answer":[0],"explanation":"A large generalization gap warrants leakage review and complexity control."},{"id":"q158","module":"22","domain":"development","kind":"practical","prompt":"In Spark ML, an unfitted Pipeline contains a StringIndexer and LogisticRegression. What method produces fitted stages?","options":["pipeline.fit(train_df)","pipeline.transform(train_df) only","pipeline.predict(train_df)","pipeline.count()"],"answer":[0],"explanation":"Pipeline.fit trains Estimators and returns a fitted PipelineModel."},{"id":"q159","module":"31","domain":"pro_development","kind":"theory","prompt":"A dataset has 400M records and categorical features. Which pipeline is generally appropriate for distributed preprocessing?","options":["Spark StringIndexer, OneHotEncoder and VectorAssembler","Collect the entire dataset to pandas then call get_dummies","Apply LabelEncoder to strings on one laptop","Read raw records into a Python list on the driver"],"answer":[0],"explanation":"Spark ML stages distribute feature preparation without a full driver collection."},{"id":"q160","module":"31","domain":"pro_development","kind":"theory","prompt":"When does Spark ML typically offer a compelling advantage over single-node sklearn?","options":["Data volume or supported algorithm benefits from distributed training","Any model has fewer than 100 rows","A single network must fit on one device only","Training uses no parallelizable computation"],"answer":[0],"explanation":"Distributed execution is most valuable when the algorithm and data justify its overhead."},{"id":"q161","module":"31","domain":"pro_development","kind":"theory","prompt":"A groupBy('store').applyInPandas model trains per store.   {q:'Why would you choose MAE instead of RMSE?',a:'MAE measures average absolute error in business units and is more robust to unusually large errors. RMSE puts additional weight on large misses. I select the metric based on the cost function and evaluate errors by segment.'},

function library(){const tracks=['All',...new Set(COURSE.map(m=>m.track))];let mods=COURSE.filter(m=>(UI.track==='All'||m.track===UI.track)&&(!UI.libSearch||[m.title,m.summary,m.track,...m.concepts.map(c=>c.term)].join(' ').toLowerCase().includes(UI.libSearch.toLowerCase())));return `<div class="eyebrow">THE COMPLETE LEARNING LIBRARY</div><h1>From fundamentals to production.</h1><p class="lead">${COURSE.length} intensive modules. Every lesson includes precise English terminology, applied context, a Python or SQL example, and a practical exercise.</p><div class="toolbar"><input id="libsearch" class="input" type="search" placeholder="Filter topics or vocabulary…" value="${esc(UI.libSearch)}"/><select id="trackfilter" class="select">${tracks.map(t=>`<option value="${esc(t)}" ${t===UI.track?'selected':''}>${esc(t)}</option>`).join('')}</select>${tag(`${mods.length} modules`,'purple')}${tag(`${allConcepts.length} concepts`)}</div><div class="module-list">${mods.map(m=>moduleCard(m)).join('')}</div>${mods.length?'':`<div class="empty">No modules found. Try a broader search term.</div>`}`}
