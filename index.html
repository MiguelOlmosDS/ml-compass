const COURSE = [{"id":"01","title":"ML workflow & professional vocabulary","track":"Foundations","level":"Foundation","domain":null,"summary":"Speak confidently about the complete lifecycle of a machine learning project.","concepts":[{"term":"Problem framing","definition":"Translate a business objective into a predictive task, target variable, decision rule, and cost of mistakes. Ask whether the problem actually needs machine learning or could use deterministic rules.","example":"A retailer wants a weekly reorder recommendation; state the target as future units sold and constraints as inventory and budget."},{"term":"Feature vs target","definition":"Features (X) are information available at prediction time; the target (y) is the outcome being predicted. This boundary is fundamental because any future information in X leaks the answer.","example":"Weekly sales history, price and promotions are features; next-week demand is the target."},{"term":"Training, validation, testing","definition":"Training data fits parameters; validation data guides design and tuning; the untouched test set estimates generalization after decisions are frozen. Report metrics on the test set sparingly.","example":"Fit on past orders, choose hyperparameters on later weeks, and evaluate once on the final held-out weeks."},{"term":"Baseline","definition":"A simple reference predictor used to determine whether complexity creates genuine value. Useful baselines include majority class, median, seasonal naive and linear regression.","example":"Compare a demand model against last week's sales before claiming performance improvements."},{"term":"Inference & serving","definition":"Inference applies a trained artifact to unseen features. Serving defines how predictions reach users: batch tables, streaming computation or low-latency API endpoints.","example":"A nightly job produces suggested quantities for every store before the next delivery cycle."}],"code":"# Baseline regression: predict the training median\nimport numpy as np\nbaseline = np.median(y_train)\npredictions = np.full(len(y_test), baseline)\nmae = np.mean(np.abs(y_test - predictions))\nprint('Baseline MAE:', round(mae, 2))","lab":{"title":"Hands-on challenge: ML workflow & professional vocabulary","task":"Choose a target, 4 safe features, a leakage risk, and a baseline for weekly demand prediction. Explain in English why each feature is available at inference time.","solution":"Target: next_week_units. Features: lag_1_units, lag_4_mean_units, current_price, known_promotion. Risk: using next_week_actual_sales or calculating rolling means over future rows. Baseline: previous-week units; evaluate with MAE on chronological holdout.","checks":["Identify a measurable target","Explain a time-safe split","Compare against a baseline"]},"minutes":50},{"id":"02","title":"Python essentials for data scientists","track":"Foundations","level":"Foundation","domain":null,"summary":"Write robust, readable analysis code instead of memorizing syntax.","concepts":[{"term":"Vectorization","definition":"Apply operations to whole arrays or columns rather than Python row-by-row loops. Array-level operations often reduce interpreter overhead substantially, but watch memory use.","example":"Compute all absolute errors as np.abs(y_true - y_pred) in one operation."},{"term":"Mutability & copying","definition":"Lists and dictionaries are mutable; assignment aliases an object. DataFrame views and copies can behave differently; use explicit .copy() where isolation matters.","example":"filtered = df.loc[df.flag].copy() makes later feature edits unambiguous."},{"term":"Functions and type hints","definition":"Small pure functions make feature engineering reproducible and testable. Type annotations document expectations, while assertions or validation libraries check invariants at runtime.","example":"def rmse(actual: np.ndarray, predicted: np.ndarray) -> float: ..."},{"term":"Exceptions & data contracts","definition":"Production pipelines must fail loudly for missing columns, invalid types and impossible values. A silent fallback can conceal systematic data quality failures.","example":"Validate that order_quantity is numeric and nonnegative before training."},{"term":"Reproducibility","definition":"Random seeds control many stochastic operations, but environment versions, hardware and data snapshots also affect repeatability. Log those alongside model parameters.","example":"Set random_state=42 and capture requirements.txt and the dataset version."}],"code":"import pandas as pd\n\ndef validate_orders(df: pd.DataFrame) -> pd.DataFrame:\n    required = {'store_id', 'units', 'date'}\n    missing = required - set(df.columns)\n    if missing:\n        raise ValueError(f'Missing columns: {sorted(missing)}')\n    out = df.copy()\n    out['date'] = pd.to_datetime(out['date'])\n    if (out['units'] < 0).any():\n        raise ValueError('Negative units')\n    return out","lab":{"title":"Hands-on challenge: Python essentials for data scientists","task":"Write a function that accepts a DataFrame with actual and predicted, rejects missing columns, and returns MAE without modifying input.","solution":"def safe_mae(df):\n    required = {'actual','predicted'}\n    if not required.issubset(df.columns):\n        raise ValueError('Missing columns')\n    if df[['actual','predicted']].isna().any().any():\n        raise ValueError('Null values')\n    return (df['actual'] - df['predicted']).abs().mean()","checks":["No mutation","Clear validation errors","Vectorized computation"]},"minutes":50},{"id":"03","title":"Linear algebra & optimization","track":"Foundations","level":"Foundation","domain":null,"summary":"Learn the math behind the models, gradients and embeddings.","concepts":[{"term":"Vectors, matrices and shapes","definition":"A feature matrix X usually has shape (n_samples, n_features). Matrix multiplication requires aligned inner dimensions; shape mismatches are common bugs.","example":"X @ weights returns one linear prediction per row when weights has one coefficient per feature."},{"term":"Dot product","definition":"The dot product measures weighted alignment. In a linear model, each input is multiplied by its coefficient and summed before adding an intercept.","example":"Predicted revenue = 2.3 * advertising + 0.7 * visits + intercept."},{"term":"Gradient descent","definition":"Optimization iteratively moves parameters opposite the gradient of a differentiable loss. Too large a learning rate diverges; too small converges slowly.","example":"Update w <- w - learning_rate * dLoss/dw."},{"term":"Regularization","definition":"L1 encourages sparse coefficients and L2 penalizes large weights smoothly. Regularization can lower variance at the cost of some bias.","example":"Ridge regression stabilizes estimates when features are strongly correlated."},{"term":"Eigenvectors, SVD & PCA","definition":"PCA rotates centered features into orthogonal directions of maximal variance, often implemented through SVD. High variance is not guaranteed to mean high predictive relevance.","example":"Compress 300 correlated numerical features to 20 components and validate accuracy."}],"code":"import numpy as np\nX = np.array([[1., 2.], [3., 4.]])\nw = np.array([0.5, -0.2])\ny_hat = X @ w + 1.0\nprint('X:', X.shape, 'w:', w.shape, 'pred:', y_hat)","lab":{"title":"Hands-on challenge: Linear algebra & optimization","task":"Derive the number of parameters in a linear model with 12 features, one output, and an intercept. Explain L1 vs L2 regularization.","solution":"13 parameters: one coefficient for each of 12 features plus one intercept. L1 adds lambda * sum(abs(weights)); L2 adds lambda * sum(weights**2), with convention-dependent scaling.","checks":["Correct shapes","State 13 parameters","Contrast sparse and shrinkage effects"]},"minutes":50},{"id":"04","title":"Probability & descriptive statistics","track":"Foundations","level":"Foundation","domain":null,"summary":"Distinguish uncertainty, distribution shape and statistical estimates.","concepts":[{"term":"Population vs sample","definition":"A population is the full group of interest, while a sample is observed data used to infer population properties. Selection bias makes even large samples misleading.","example":"Store visits from only high-volume stores cannot reliably represent the entire retail network."},{"term":"Mean, median, mode","definition":"Mean responds strongly to outliers, median is robust to extreme magnitudes, and mode denotes the most frequent value or category. Pick statistics to match skew and business meaning.","example":"Median order value better describes a right-skewed basket distribution."},{"term":"Variance & standard deviation","definition":"Variance summarizes average squared deviation from the mean; standard deviation is in the original units. The sample variance commonly uses n-1 degrees of freedom.","example":"A large sales standard deviation indicates volatility but not necessarily poor model fit."},{"term":"Conditional probability & Bayes","definition":"P(A|B) updates a probability after observing B. Base rates matter especially in rare-event classification; a seemingly good test may have low positive predictive value.","example":"Fraud detection must account for a 0.5% fraud prevalence before interpreting positive alerts."},{"term":"Confidence intervals","definition":"A frequentist 95% interval procedure covers the fixed parameter in 95% of repeated samples under its assumptions. It is not generally a 95% probability statement about a fixed parameter after observing data.","example":"Bootstrap a 95% confidence interval for average revenue lift."}],"code":"import numpy as np\nx = np.array([9, 10, 10, 11, 90])\nprint('mean:', x.mean())\nprint('median:', np.median(x))\nprint('sample std:', x.std(ddof=1))","lab":{"title":"Hands-on challenge: Probability & descriptive statistics","task":"Explain what happens to mean and median when an outlier changes from 90 to 900 in the example.","solution":"The mean increases dramatically: 26 to 188; the median remains 10. Both statistics are correct but summarize different aspects of a skewed distribution.","checks":["Compute the updated mean","Explain robustness","Mention skew"]},"minutes":50},{"id":"05","title":"Hypothesis tests & experimentation","track":"Foundations","level":"Intermediate","domain":null,"summary":"Interpret experiments without confusing statistical and business significance.","concepts":[{"term":"Null and alternative hypotheses","definition":"H0 often represents no effect; H1 represents a change or improvement. Define them before seeing results to reduce selective reporting.","example":"H0: a new ranking algorithm does not change average basket value."},{"term":"P-value","definition":"Under H0 and model assumptions, a p-value is the probability of results at least as extreme as those observed. It is not the probability that H0 is true.","example":"p=.03 is not a 97% chance that the experiment worked."},{"term":"Type I and Type II errors","definition":"False rejection of H0 is a Type I error; failing to reject a false H0 is Type II. Power is 1 minus the Type II error probability.","example":"A tiny A/B test can miss a meaningful lift due to insufficient power."},{"term":"Effect size & practical significance","definition":"Business value depends on magnitude, uncertainty, and costs, not only statistical significance. Report confidence intervals and relevant cost-based metrics.","example":"A +0.1% conversion lift can be statistically significant but below deployment cost."},{"term":"Multiple comparisons","definition":"Testing many hypotheses raises the chance of at least one false positive. Use prespecified analyses, corrections, or controlled false discovery rates.","example":"Trying 40 variants then celebrating only the smallest p-value is p-hacking."}],"code":"from scipy.stats import ttest_ind\ncontrol = [12, 14, 11, 13, 12]\ntreatment = [14, 15, 13, 16, 15]\nstat, p_value = ttest_ind(control, treatment, equal_var=False)\nprint('Welch t-test p-value:', p_value)","lab":{"title":"Hands-on challenge: Hypothesis tests & experimentation","task":"Design an A/B experiment for a suggested-order system: unit of randomization, guardrail metric, primary metric, and failure risk.","solution":"Randomize stores (or retailers if interference is controlled), not individual orders for the same store. Primary: profit or fulfillment-adjusted revenue lift. Guardrails: stockouts, returns, customer complaints. Risks: seasonality, noncompliance, interference between stores.","checks":["State unit of randomization","Predefine success metric","Mention power or interference"]},"minutes":50},{"id":"06","title":"pandas & analytical SQL","track":"Foundations","level":"Foundation","domain":null,"summary":"Manipulate structured datasets accurately, including joins and aggregations.","concepts":[{"term":"Grain","definition":"The grain describes what exactly one row represents. Every join or groupby should preserve or intentionally transform that grain.","example":"A table with one row per store-product-week cannot be joined blindly to item-level transactions."},{"term":"Join cardinality","definition":"One-to-one, one-to-many, and many-to-many joins have different row-count effects. Check unique keys and expected row counts before trusting aggregates.","example":"Two duplicate price rows per SKU can double totals after a join."},{"term":"GroupBy aggregation","definition":"GroupBy separates data into groups, applies an aggregation and recombines results. An aggregate needs a clear denominator for rates and weighted metrics.","example":"Sum revenue per market rather than averaging store-level percentages."},{"term":"Window functions","definition":"SQL windows compute ranks, running totals or lagged values while preserving rows. LAG is valuable for historical feature construction.","example":"LAG(units, 1) OVER(PARTITION BY sku ORDER BY week) creates last-week units."},{"term":"Null semantics","definition":"SQL NULL means unknown or missing; comparisons use IS NULL and aggregates often ignore nulls. pandas has explicit NA handling and nullable dtypes.","example":"COUNT(*) and COUNT(col) can differ when col contains NULL."}],"code":"# Weekly sales features in SQL\nSELECT store_id, sku, week,\n       SUM(units) AS units,\n       LAG(SUM(units)) OVER (\n           PARTITION BY store_id, sku ORDER BY week\n       ) AS prev_week_units\nFROM sales\nGROUP BY store_id, sku, week;","lab":{"title":"Hands-on challenge: pandas & analytical SQL","task":"Write a query that finds duplicate keys (store_id, sku, week) in a weekly feature table and explain what that means for an ML join.","solution":"SELECT store_id, sku, week, COUNT(*) AS n\nFROM features\nGROUP BY store_id, sku, week\nHAVING COUNT(*) > 1;\n-- Duplicated keys can multiply rows and corrupt labels during joining.","checks":["Validate key uniqueness","Use HAVING","Explain join multiplication"]},"minutes":50},{"id":"07","title":"EDA, visualizations & Spark summaries","track":"Data Preparation","level":"Intermediate","domain":"processing","summary":"Explore distributions and relationships before choosing transformations.","concepts":[{"term":"Exploratory data analysis (EDA)","definition":"EDA reveals distributions, missingness, anomalies, imbalance and data collection defects. Do it on development data without repeatedly examining the final test set.","example":"Inspect revenue distributions and seasonality before selecting a demand model."},{"term":"Univariate plots","definition":"Histograms and boxplots summarize continuous distributions; countplots/bar charts summarize categorical frequencies. Do not treat unordered categories as a continuous variable.","example":"Plot sales histogram and region-frequency bar chart separately."},{"term":"Bivariate comparison","definition":"For two numeric variables, use scatterplots and numeric correlation; for two categorical variables, use contingency tables and chi-square tests with appropriate assumptions.","example":"Compare unit_price versus volume by scatterplot; region versus churn by crosstab."},{"term":"Spark summary statistics","definition":"Spark DataFrame .summary() and .describe() calculate column-level statistics in distributed computation. Avoid collecting massive raw datasets to pandas just for summary.","example":"spark.table('catalog.schema.table').summary().display() in a Databricks notebook."},{"term":"Correlation vs causation","definition":"A predictive association does not show that changing a feature will change the outcome. Confounders and reverse causality can create misleading relationships.","example":"More stockouts correlate with demand but are not an intervention that increases sales."}],"code":"from pyspark.sql import functions as F\nspark_df.summary('count', 'mean', 'stddev', 'min', 'max').show()\nspark_df.select(F.corr('price', 'units').alias('corr')).show()\n# pandas development sample only:\n# pdf = spark_df.sample(fraction=0.01, seed=42).toPandas()","lab":{"title":"Hands-on challenge: EDA, visualizations & Spark summaries","task":"Choose plots for two continuous features, two categorical features, and one continuous feature with a strongly skewed distribution.","solution":"Numeric-numeric: scatterplot and Pearson/Spearman correlation. Category-category: count heatmap or contingency table. Skewed numeric: histogram with log-scaled axis if values are positive; state whether the axis or the data were transformed.","checks":["Choose appropriate charts","Check outliers/missingness","Avoid causality claims"]},"minutes":50},{"id":"08","title":"Missing values, outliers & distributions","track":"Data Preparation","level":"Intermediate","domain":"processing","summary":"Make transformation choices based on distributions, not one-size-fits-all rules.","concepts":[{"term":"MCAR, MAR, MNAR","definition":"Missing Completely At Random is independent of observed and missing values; Missing At Random can depend on observed variables; Missing Not At Random depends on unobserved missing values. Diagnose carefully.","example":"Missing income is more common for certain customer segments, so mean imputation may bias downstream estimates."},{"term":"Mean, median, mode imputation","definition":"Mean is suitable for roughly symmetric numeric data without severe outliers; median is robust for skewed numeric data; mode can suit categorical variables. Fit imputers only on training folds.","example":"Use median for heavily right-skewed purchase amounts."},{"term":"Interquartile range (IQR)","definition":"Q3-Q1 is a robust spread measure. A common outlier rule flags values below Q1-1.5*IQR or above Q3+1.5*IQR. Such flags require business judgment, not automatic deletion.","example":"Large corporate orders may be valid rather than erroneous outliers."},{"term":"Z-score filtering","definition":"Standardize each observation by subtracting the mean and dividing by standard deviation. It assumes the mean/std meaningfully describe the distribution and is fragile with heavy tails.","example":"A 3-sigma filter is less appropriate for strongly skewed sales data."},{"term":"Log transform","definition":"log or log1p compresses large positive values and often reduces right-skew. Applying log1p to counts with zeros can be useful; inverse-transform before reporting metrics on the original target scale.","example":"np.expm1(model.predict(X)) returns demand predictions from a log1p-trained target."}],"code":"from sklearn.impute import SimpleImputer\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import FunctionTransformer\nimport numpy as np\npipeline = Pipeline([\n    ('imputer', SimpleImputer(strategy='median')),\n    ('log', FunctionTransformer(np.log1p, validate=False))\n])\nX_train_t = pipeline.fit_transform(X_train)\nX_test_t = pipeline.transform(X_test)","lab":{"title":"Hands-on challenge: Missing values, outliers & distributions","task":"For [1,2,2,3,100], calculate Q1, Q3, IQR under a stated quantile convention; explain why deleting 100 might be wrong.","solution":"One common linear-interpolation convention gives Q1=2, Q3=3, IQR=1; upper fence=4.5, so 100 is flagged. Confirm business validity before removal: exceptional but legitimate sales may matter to your target.","checks":["State quantile convention","Calculate IQR/fence","Keep business context"]},"minutes":50},{"id":"09","title":"Categorical encoding & feature scaling","track":"Data Preparation","level":"Intermediate","domain":"processing","summary":"Avoid high-cardinality blowups and transformation leakage.","concepts":[{"term":"One-hot encoding","definition":"One-hot creates indicator columns for categories, avoiding arbitrary ordinal relationships. It can be inefficient for thousands of distinct IDs.","example":"A categorical 'channel' with three classes becomes a small indicator matrix."},{"term":"Ordinal encoding","definition":"Maps labels to integers; appropriate if the categories have true order or the model treats integer categories appropriately. Arbitrary numeric codes in a linear model imply a false distance.","example":"Low/medium/high is ordered; country names are not."},{"term":"Standardization","definition":"Subtract training mean and divide by training standard deviation. Especially important for distance-based models, SVM and regularized linear models; less important for many tree ensembles.","example":"StandardScaler inside Pipeline prevents train-test contamination."},{"term":"ColumnTransformer","definition":"Dispatches numeric/categorical preprocessing to separate transformations and puts them into one fit/transform workflow.","example":"Median imputation+scaling for numeric columns, mode+one-hot for categories."},{"term":"High-cardinality encoding","definition":"Frequency, hashing, target encoding and embeddings reduce one-hot dimensionality; target encoding must be cross-fitted to prevent leakage.","example":"Encoding store_id with target means on all rows leaks validation labels."}],"code":"from sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.pipeline import Pipeline\npreprocess = ColumnTransformer([\n    ('num', Pipeline([('impute',SimpleImputer(strategy='median')),\n                       ('scale',StandardScaler())]), ['price','units']),\n    ('cat', OneHotEncoder(handle_unknown='ignore'), ['region'])\n])","lab":{"title":"Hands-on challenge: Categorical encoding & feature scaling","task":"Build a preprocessing plan for price (numeric, skewed), channel (4 categories), and store_id (80,000 unique IDs).","solution":"Use log1p or robust numerical transformation for price if appropriate; OneHotEncoder for channel; investigate hashing/frequency or learned embeddings for store_id, and verify that the identifier generalizes to unseen stores. Fit each transform using training folds only.","checks":["Justify encoding","Prevent leakage","Discuss unknown categories"]},"minutes":50},{"id":"10","title":"Data splits, leakage & validation design","track":"Model Development","level":"Intermediate","domain":"development","summary":"Choose splits that match how the model will be used in real life.","concepts":[{"term":"Train/validation/test","definition":"The train split fits model parameters, validation selects modeling decisions, and test estimates final performance. Randomly splitting a time-dependent dataset usually breaks causal availability.","example":"Train through July, tune on August, test on September for weekly demand."},{"term":"Temporal leakage","definition":"Information from timestamps after prediction time can enter features or preprocessing. Sort by event time and construct lag features within entity groups.","example":"A rolling average centered on a week includes future weeks and should not be used for forward forecasts."},{"term":"Group leakage","definition":"Multiple rows for the same user/store in different splits can cause overly optimistic estimates when predicting new entities. Use GroupKFold or GroupShuffleSplit when group independence matters.","example":"All transactions for an unseen retailer must stay in the same holdout group."},{"term":"Cross-validation","definition":"K-fold CV averages performance over several held-out folds. It reduces split sensitivity but costs k fits per candidate and requires appropriate stratification/groups/time ordering.","example":"Use TimeSeriesSplit on chronological demand data, not ordinary shuffled KFold."},{"term":"Nested validation","definition":"Nested cross-validation separates hyperparameter selection (inner CV) from generalization estimation (outer CV). Especially useful with limited data and extensive tuning.","example":"A grid search performed before test evaluation should not use test labels in selection."}],"code":"from sklearn.model_selection import TimeSeriesSplit\ncv = TimeSeriesSplit(n_splits=4)\nfor train_idx, valid_idx in cv.split(X):\n    model.fit(X.iloc[train_idx], y.iloc[train_idx])\n    pred = model.predict(X.iloc[valid_idx])\n    print(len(train_idx), len(valid_idx))","lab":{"title":"Hands-on challenge: Data splits, leakage & validation design","task":"Explain how you would validate a demand model with 52 weekly observations and strong seasonality.","solution":"Reserve the most recent block of weeks as test. Use rolling or expanding time-series folds for tuning; compute lagged features using only prior values. Compare to seasonal-naive baselines and report uncertainty due to small sample size.","checks":["No future information","Temporal folds","Seasonal baseline"]},"minutes":50},{"id":"11","title":"Regression algorithms & losses","track":"Model Development","level":"Intermediate","domain":"development","summary":"Match continuous targets, objectives and model assumptions.","concepts":[{"term":"Linear regression","definition":"Fits a linear combination of features by minimizing squared error, often through least squares. Assumptions matter mainly for inference; predictive quality depends on distribution shift and feature design.","example":"Predict weekly units with price, promotion and seasonality features."},{"term":"Ridge and Lasso","definition":"Ridge uses an L2 penalty to shrink coefficients; Lasso uses L1 and can set coefficients to zero. Both require proper scaling for meaningful penalization.","example":"Prefer Ridge for highly correlated lag features; test Lasso for sparse selection."},{"term":"Decision tree regressor","definition":"Recursively splits the feature space into regions with near-constant target values. Captures nonlinearity but deep trees are high-variance and unstable.","example":"Learn thresholds where price discounts change expected sales volume."},{"term":"Gradient boosting","definition":"Sequentially fits weak learners to reduce residual error or optimize a chosen objective. XGBoost and LightGBM often perform well on tabular problems with tuned complexity.","example":"Train boosted trees on features such as store category and lag statistics."},{"term":"MAE vs MSE objective","definition":"MSE penalizes large misses quadratically; MAE penalizes linearly and is more robust to outliers. The optimal point predictor changes with loss (mean for squared error, median for absolute error).","example":"If occasional large stockouts dominate business cost, an asymmetric custom loss may be more appropriate."}],"code":"from sklearn.ensemble import HistGradientBoostingRegressor\nfrom sklearn.metrics import mean_absolute_error\nmodel = HistGradientBoostingRegressor(max_iter=100, random_state=42)\nmodel.fit(X_train, y_train)\npred = model.predict(X_valid)\nprint(mean_absolute_error(y_valid, pred))","lab":{"title":"Hands-on challenge: Regression algorithms & losses","task":"Choose between linear, Random Forest and gradient boosting for sales prediction with 100K rows, categorical promotions and nonlinear price response. Justify tradeoffs.","solution":"Start with a linear baseline; use a preprocessing pipeline. Compare RandomForest and gradient boosting with temporal validation, cost-aware MAE, fit time, latency and interpretable error slices. Avoid claiming any one algorithm always wins.","checks":["Compare baselines","Match objective metric","Use proper validation"]},"minutes":50},{"id":"12","title":"Classification & decision thresholds","track":"Model Development","level":"Intermediate","domain":"development","summary":"Think in calibrated probabilities and decision costs, not only class labels.","concepts":[{"term":"Binary vs multiclass","definition":"Binary classification chooses between two outcomes; multiclass chooses exactly one of several; multilabel allows several simultaneous outcomes. The task determines loss, outputs and metrics.","example":"Churn yes/no is binary; support ticket category is multiclass."},{"term":"Logistic regression","definition":"Models log odds as a linear function of inputs and produces probabilities through sigmoid. Despite the name, it is a classifier.","example":"Estimate probability a retailer will miss a scheduled order."},{"term":"Threshold selection","definition":"The default 0.5 cutoff is not inherently optimal. Use the cost of false positives versus false negatives and validation distributions to choose the decision rule.","example":"Alert on stockout risk when expected prevention value outweighs intervention cost."},{"term":"Probability calibration","definition":"A calibrated 0.8 score corresponds to ~80% positives over comparable cases. Calibration matters when the probability feeds economic decision making.","example":"Assess with reliability diagrams and Brier score."},{"term":"Multiclass strategies","definition":"Softmax regression learns competing class scores; one-vs-rest trains binary classifiers. Some estimators support only certain class configurations.","example":"Classify customer issues as delivery, payment, product or other."}],"code":"from sklearn.metrics import precision_recall_curve\nproba = model.predict_proba(X_valid)[:, 1]\nprecision, recall, thresholds = precision_recall_curve(y_valid, proba)\n# Select a decision threshold using validated costs, not test labels.","lab":{"title":"Hands-on challenge: Classification & decision thresholds","task":"A fraud model catches 90% of fraud but flags 30% of legitimate transactions. Describe how you would set a threshold.","solution":"Calculate the cost of missed fraud versus blocked legitimate transactions, examine precision/recall across candidate thresholds, choose on validation data and assess calibration. Document operational alert capacity.","checks":["Avoid accuracy-only reasoning","Include base rates","Define a cost-based threshold"]},"minutes":50},{"id":"13","title":"Metrics & error analysis","track":"Model Development","level":"Intermediate","domain":"development","summary":"Select metrics whose interpretation matches the real decision.","concepts":[{"term":"Confusion matrix","definition":"TN, FP, FN and TP count prediction outcomes at a chosen threshold. From them derive precision, recall, specificity and F1.","example":"For stockout alerts, FN means a missed actual stockout."},{"term":"Precision, recall & F1","definition":"Precision = TP/(TP+FP); recall = TP/(TP+FN); F1 is their harmonic mean. F1 is not a substitute for a cost function or calibration analysis.","example":"Prioritize recall when missed failures are very costly; prioritize precision when investigations are expensive."},{"term":"ROC-AUC vs PR-AUC","definition":"ROC-AUC captures ranking across false positive rates; PR-AUC highlights performance on rare positive classes, with baseline precision near positive prevalence.","example":"Evaluate fraud models with precision-recall curves under 0.2% prevalence."},{"term":"MAE, RMSE, R²","definition":"MAE reports average absolute error in target units; RMSE emphasizes large errors; R² compares explained squared error against predicting the sample mean and can be negative.","example":"Demand MAE=4 means an average absolute error of 4 pieces."},{"term":"Log loss & calibration","definition":"Log loss evaluates probability predictions and penalizes confident wrong answers. A classifier with high accuracy may still have unusable uncalibrated scores.","example":"Compare customer-churn probabilities with log loss and reliability plots."}],"code":"from sklearn.metrics import mean_absolute_error, root_mean_squared_error\nmae = mean_absolute_error(y_true, y_pred)\nrmse = root_mean_squared_error(y_true, y_pred)  # recent scikit-learn\nprint('MAE', mae, 'RMSE', rmse)\n# Compatibility: mean_squared_error(y_true, y_pred) ** 0.5","lab":{"title":"Hands-on challenge: Metrics & error analysis","task":"Compute precision, recall and F1 when TP=40, FP=10, FN=20 and TN=930. Explain why accuracy is misleading.","solution":"Precision=40/50=0.80; recall=40/60≈0.667; F1=80/110≈0.727. Accuracy=(40+930)/1000=97%, but 20 of 60 actual positives are missed.","checks":["Correct formulas","State missed positives","Business interpretation"]},"minutes":50},{"id":"14","title":"Pipelines & cross-validation","track":"Model Development","level":"Intermediate","domain":"development","summary":"Build leak-resistant, reproducible sklearn workflows.","concepts":[{"term":"Pipeline","definition":"A Pipeline chains transforms and an estimator. During CV, each transform is fit inside its training fold rather than on all data, preventing preprocessing leakage.","example":"Pipeline([('scale', StandardScaler()),('clf',LogisticRegression())])."},{"term":"Estimator vs transformer","definition":"In sklearn, estimators expose fit; transformers expose transform (typically also fit). A final predictive estimator uses predict or predict_proba.","example":"SimpleImputer is a transformer; LogisticRegression is an estimator."},{"term":"GridSearchCV","definition":"Evaluates a Cartesian product of candidate hyperparameters, typically with cross-validation. If 3 values * 2 values and 5 folds, it performs 30 CV fits, often plus a final refit.","example":"Specify param_grid={'model__C':[.1,1,10], 'model__penalty':['l1','l2']} with compatible solver."},{"term":"Stratified CV","definition":"Stratification preserves class proportions approximately across folds, helping rare-class evaluation. It does not solve temporal or group leakage.","example":"StratifiedKFold for independent imbalanced binary records."},{"term":"Reproducibility and caching","definition":"Use fixed splits, versioned datasets, sklearn Pipeline and logged parameters; caching repeated expensive transformations can improve iterative experiments.","example":"Share the exact pipeline artifact used in validation with the deployment code."}],"code":"from sklearn.pipeline import Pipeline\nfrom sklearn.model_selection import GridSearchCV\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\npipe = Pipeline([('scaler', StandardScaler()),\n                 ('model', LogisticRegression(max_iter=1000))])\nsearch = GridSearchCV(pipe, {'model__C': [0.1, 1, 10]}, cv=5,\n                      scoring='f1', n_jobs=-1)\nsearch.fit(X_train, y_train)","lab":{"title":"Hands-on challenge: Pipelines & cross-validation","task":"Calculate fits for 4 learning rates × 3 tree depths × 5 folds, then explain the effect of refit=True.","solution":"There are 4*3*5=60 cross-validation fits. If refit=True (default), GridSearchCV also refits the best configuration on the full provided training dataset, yielding 61 total fits.","checks":["60 CV fits","Account for refit","No test leakage"]},"minutes":50},{"id":"15","title":"Hyperparameter tuning & search strategies","track":"Model Development","level":"Advanced","domain":"development","summary":"Choose search methods and recognize the tradeoffs of distributed tuning.","concepts":[{"term":"Hyperparameters vs parameters","definition":"Hyperparameters are chosen before fitting, while model parameters are learned from training data. Keep validation separate from test to avoid overfitting hyperparameter choices.","example":"max_depth is a hyperparameter; decision-tree split thresholds are learned parameters."},{"term":"Grid vs random search","definition":"Grid exhaustively tests all defined combinations; random search samples a budget from distributions and often explores high-dimensional spaces more efficiently.","example":"Sample learning rates on a log scale instead of checking only equally spaced values."},{"term":"Bayesian optimization","definition":"Uses past trial outcomes to guide the selection of promising configurations. It is useful when each evaluation is expensive but may have optimization overhead.","example":"Hyperopt's TPE algorithm proposes candidates for expensive model fits."},{"term":"Hyperopt fmin","definition":"fmin minimizes an objective over a search space. The objective can return a loss and status; labels are constructed with hp choices. Some Hyperopt/Spark integrations are legacy and should be checked against current runtime support.","example":"fmin(fn=objective, space=space, algo=tpe.suggest, max_evals=30)."},{"term":"Parallel trial execution","definition":"Parallel tuning can reduce wall-clock time when compute is available, but oversubscription, large data movement and excessive parallelism harm throughput.","example":"Tune independent single-node models in parallel instead of collecting the full Spark dataset for each trial."}],"code":"from hyperopt import fmin, tpe, hp, STATUS_OK, Trials\n\ndef objective(params):\n    # Fit/evaluate on a validation split; return a value to MINIMIZE\n    loss = train_and_evaluate(params)\n    return {'loss': float(loss), 'status': STATUS_OK}\nspace = {'max_depth': hp.choice('max_depth', [3, 5, 8])}\nbest = fmin(fn=objective, space=space, algo=tpe.suggest,\n            max_evals=20, trials=Trials())","lab":{"title":"Hands-on challenge: Hyperparameter tuning & search strategies","task":"Explain why random search may beat a 5×5×5 grid if only one hyperparameter matters, with a fixed trial budget.","solution":"A grid spends many trials repeating the same influential value while varying irrelevant dimensions. Random search explores more unique values of the influential dimension per evaluation under a fixed budget; then cross-validate selected candidates.","checks":["Discuss trial budget","Identify important dimensions","No test tuning"]},"minutes":50},{"id":"16","title":"Imbalanced classification & cost-sensitive ML","track":"Model Development","level":"Intermediate","domain":"development","summary":"Detect rare outcomes without being fooled by majority-class accuracy.","concepts":[{"term":"Class imbalance","definition":"A dataset with 1% positive labels permits a classifier that always predicts negative to achieve 99% accuracy. Evaluate class-specific metrics and costs.","example":"Fraud, churn and equipment failure are often rare positives."},{"term":"Class weights","definition":"Increase the penalty of misclassifying minority examples without necessarily duplicating rows. Calibrate probabilities afterward if probability estimates are needed.","example":"LogisticRegression(class_weight='balanced') adjusts training loss."},{"term":"Resampling","definition":"Oversampling minority cases or undersampling majority cases changes the training distribution. Apply resampling only within training folds, never before a split.","example":"SMOTE synthetic records before splitting can leak information across folds."},{"term":"Threshold tuning","definition":"A threshold optimized for business cost can improve operational decisions without changing model parameters. Use a held-out validation set to avoid overfitting.","example":"Set threshold to cap false positive investigation volume."},{"term":"Data collection and stratification","definition":"Additional representative minority examples may outperform elaborate methods. Stratified splitting helps class proportions but cannot fix dataset shift.","example":"Collect more real failure examples across sites and seasons."}],"code":"from sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import average_precision_score\nmodel = LogisticRegression(class_weight='balanced', max_iter=1000)\nmodel.fit(X_train, y_train)\nprobs = model.predict_proba(X_valid)[:, 1]\nprint('PR-AUC / average precision:', average_precision_score(y_valid, probs))","lab":{"title":"Hands-on challenge: Imbalanced classification & cost-sensitive ML","task":"For a 0.5% event rate, propose evaluation metrics and three mitigation strategies.","solution":"Use PR-AUC/average precision, recall at fixed precision, confusion-matrix costs, and probability calibration. Try class-weighted loss, training-fold resampling, and representative minority data collection; compare after temporal/group-aware validation.","checks":["Avoid accuracy trap","Prevent resampling leakage","Report business costs"]},"minutes":50},{"id":"17","title":"Ensembles, interpretability & bias–variance","track":"Model Development","level":"Advanced","domain":"development","summary":"Understand why models overfit and how to explain their behavior.","concepts":[{"term":"Bias–variance tradeoff","definition":"High bias means the model systematically misses important structure (underfits); high variance means it is too sensitive to training data (overfits). A huge train-validation gap usually suggests variance.","example":"Restrict tree depth or apply regularization when training error is tiny but validation error is high."},{"term":"Bagging vs boosting","definition":"Bagging averages models fit to resampled data (e.g. random forest), often reducing variance; boosting learns sequentially to correct errors, with higher tuning sensitivity.","example":"Compare random forest against gradient boosting on structured customer data."},{"term":"Feature importance","definition":"Tree impurity importance can favor high-cardinality variables; permutation importance measures validation degradation when a feature is shuffled, but correlation complicates interpretation.","example":"Validate apparent importance of product_code rather than trusting impurity scores alone."},{"term":"SHAP & local explanations","definition":"SHAP values attribute a prediction relative to a background reference under modeling assumptions; they are not generally causal effects.","example":"Explain why one store was predicted at high stockout risk."},{"term":"Fairness & robustness","definition":"Average scores can hide errors concentrated in specific groups, seasons or regions. Evaluate stability and potential disparate impacts with appropriate privacy/governance controls.","example":"Evaluate recall by region and customer segment alongside the overall result."}],"code":"from sklearn.inspection import permutation_importance\nimp = permutation_importance(model, X_valid, y_valid,\n                             scoring='neg_mean_absolute_error',\n                             n_repeats=5, random_state=42)\n# Compare importance distribution with feature correlation and drift.","lab":{"title":"Hands-on challenge: Ensembles, interpretability & bias–variance","task":"A model has train MAE=1 and validation MAE=15. Diagnose and propose four experiments.","solution":"Likely high variance or leakage/split mismatch. Check leakage and split realism; reduce complexity; add regularization; increase data or reduce unstable features; compare a baseline. Investigate drift before interpreting SHAP causally.","checks":["Recognize overfitting","Test leakage","Use simple baseline"]},"minutes":50},{"id":"18","title":"Clustering & dimensionality reduction","track":"Advanced Topics","level":"Advanced","domain":null,"summary":"Learn unsupervised evaluation and feature compression.","concepts":[{"term":"K-means","definition":"Finds k centroids to minimize within-cluster squared distances. It is sensitive to feature scales, outliers and roughly spherical cluster assumptions.","example":"Group stores by standardized sales frequency, revenue and assortment breadth."},{"term":"DBSCAN","definition":"Density-based clustering finds dense regions and labels isolated points as noise. It handles irregular shapes but requires sensible distance and neighborhood parameters.","example":"Detect unusual patterns of shopper behavior without prespecifying k."},{"term":"Silhouette score","definition":"Measures cohesion versus separation using distances; useful as one diagnostic but can mislead for complex or nonconvex clusters.","example":"Compare k from 2 through 8 with both silhouette and business usefulness."},{"term":"PCA","definition":"Principal component analysis rotates centered numerical features to directions of maximum variance; scaling may be essential. Fit only on training data before evaluating downstream performance.","example":"Reduce correlated telemetry variables before anomaly modeling."},{"term":"Anomaly detection","definition":"Isolation Forest and similar methods flag atypical observations without labeled positives, but 'unusual' is not equivalent to 'fraudulent'.","example":"Review extreme order sequences with human investigators."}],"code":"from sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.cluster import KMeans\nmodel = make_pipeline(StandardScaler(),\n                      KMeans(n_clusters=4, random_state=42, n_init=10))\nlabels = model.fit_predict(features)","lab":{"title":"Hands-on challenge: Clustering & dimensionality reduction","task":"Cluster retailers using monthly revenue and visit frequency. Specify preprocessing, choosing k, and business validation.","solution":"Handle skew/scale, remove erroneous outliers, try k=2..8, inspect silhouette and stability, then examine whether clusters correspond to different workable inventory strategies.","checks":["Scale numerics","Assess stability","Check domain usefulness"]},"minutes":50},{"id":"19","title":"Time series, forecasting & backtesting","track":"Advanced Topics","level":"Advanced","domain":null,"summary":"Model demand or call volume with time-safe features and baselines.","concepts":[{"term":"Trend, seasonality and noise","definition":"Trend is long-term directional change; seasonality is a recurring periodic pattern; residual variation is not explained by these components.","example":"Weekly bakery sales may show calendar-seasonal promotions and long-term growth."},{"term":"Stationarity & drift","definition":"Many statistical methods assume roughly stable statistical properties. Structural breaks and changing customer behavior make old patterns unreliable.","example":"Forecasting during a promotion regime change requires robust evaluation."},{"term":"Lag and rolling features","definition":"Lag 1 uses the previous observation; rolling statistics must be shifted so they contain no current/future target information at the decision cutoff.","example":"groupby('sku').units.shift(1).rolling(4).mean() needs careful group-scoped logic."},{"term":"Backtesting","definition":"Walk-forward validation simulates repeated forecasts over historical cutoff dates, producing realistic errors under the planned horizon.","example":"Forecast week t+1 at every historical Monday with only data available then."},{"term":"Intermittent demand","definition":"Sparse demand with many zero weeks may require Croston-family, TSB or count-aware approaches. Evaluate forecasts and inventory decisions using suitable metrics, not blindly dividing by zero.","example":"A slow-moving SKU sells in only 3 of the last 12 weeks."}],"code":"df = df.sort_values(['sku', 'week']).copy()\ng = df.groupby('sku')['units']\ndf['lag_1'] = g.shift(1)\ndf['lag_4'] = g.shift(4)\ndf['mean_last_4'] = (df.groupby('sku')['units']\n                       .transform(lambda s: s.shift(1).rolling(4).mean()))","lab":{"title":"Hands-on challenge: Time series, forecasting & backtesting","task":"Create a backtest for a one-week-ahead forecast on 52 weeks of sales and define a seasonal naive baseline.","solution":"Choose several expanding cutoffs, train only before each cutoff, predict the next week, aggregate MAE and bias. Seasonal naive for weekly annual seasonality uses demand 52 weeks ago (if history exists), or choose a sensible prior-week or 4-week seasonal benchmark when history is short.","checks":["No future lags","Horizon-aligned metric","Explicit baseline"]},"minutes":50},{"id":"20","title":"Neural networks, NLP & embeddings","track":"Advanced Topics","level":"Advanced","domain":null,"summary":"Understand neural building blocks without losing focus on tabular ML.","concepts":[{"term":"Neural network fundamentals","definition":"A network applies affine transformations and nonlinear activations; backpropagation computes gradients through layers. Depth increases representation capacity but training needs careful regularization and monitoring.","example":"Predict product category from product descriptions using a text classifier."},{"term":"Epoch, batch and optimizer","definition":"An epoch processes the training set once; a mini-batch is a subset used for an optimizer step. Adam adapts learning rates by gradient moments and is a common practical choice.","example":"With 1,000 examples and batch size 100, one epoch includes 10 optimizer steps."},{"term":"Embeddings","definition":"Dense learned vectors represent items, words or documents in a space where similarity can be meaningful for the objective. Similarity is task-dependent, not objective semantic truth.","example":"Compare descriptions of similar support tickets using cosine similarity."},{"term":"Transformer & attention","definition":"Self-attention mixes information across token positions, enabling contextual representations. Attention scores alone are not definitive explanations of a model's decisions.","example":"A language model contextualizes 'bank' differently in finance and geography."},{"term":"Overfitting controls","definition":"Early stopping, weight decay, dropout, data augmentation and validation monitoring can improve generalization.","example":"Stop training if validation loss plateaus while train loss keeps decreasing."}],"code":"import numpy as np\n\ndef cosine_similarity(a, b):\n    a, b = np.asarray(a), np.asarray(b)\n    return (a @ b) / (np.linalg.norm(a) * np.linalg.norm(b))\nprint(cosine_similarity([1,0], [0.8,0.6]))","lab":{"title":"Hands-on challenge: Neural networks, NLP & embeddings","task":"Describe how to make a support-ticket semantic search prototype from raw text, including evaluation.","solution":"Clean and redact sensitive text, compute embeddings, index with a nearest-neighbor library, retrieve top-k, and score retrieval using labeled query-to-relevant-document pairs (Recall@k/MRR). Compare to BM25 keywords.","checks":["Separate retrieval and generation","Mention privacy","Use retrieval metrics"]},"minutes":50},{"id":"21","title":"Spark architecture & DataFrames","track":"Databricks Associate","level":"Intermediate","domain":"processing","summary":"Prepare distributed data without accidental driver bottlenecks.","concepts":[{"term":"Spark DataFrame","definition":"A distributed table with a schema and lazy transformations. Spark plans execution and only computes when an action triggers work.","example":"df.filter(F.col('units') > 0).groupBy('store').count() builds a distributed plan."},{"term":"Transformation vs action","definition":"select, filter, withColumn and groupBy are lazy transformations; count, collect and write trigger jobs. Avoid collect() on massive data.","example":"Display aggregated distributions rather than copying millions of rows locally."},{"term":"Shuffle","definition":"Data is redistributed across partitions for operations such as groupBy and large joins. Shuffles can dominate compute costs and expose skewed keys.","example":"A popular SKU can cause one hot partition and slow down group aggregates."},{"term":"Partitioning & caching","definition":"Partitioning influences task parallelism; caching can help repeated reads when memory permits. More partitions are not automatically better.","example":"Repartition on a join key only after measuring shuffle behavior."},{"term":"Delta Lake","definition":"Delta tables combine Parquet files with a transaction log for ACID operations, versioning and reliable batch/stream processing. Use Unity Catalog for governed namespaces.","example":"Train from catalog.schema.transactions with auditable table history."}],"code":"from pyspark.sql import functions as F\nweekly = (spark.table('main.retail.sales')\n          .where(F.col('units') >= 0)\n          .groupBy('store_id', 'week')\n          .agg(F.sum('units').alias('weekly_units')))\nweekly.write.mode('overwrite').format('delta').saveAsTable('main.ml.weekly_units')","lab":{"title":"Hands-on challenge: Spark architecture & DataFrames","task":"A Spark job times out after .collect() on 50 million rows. Refactor it to inspect summary statistics and 10 examples safely.","solution":"Use df.summary().show() for aggregate statistics and df.limit(10).show(truncate=False) for examples. Perform necessary filtering/grouping in Spark, and collect only genuinely small results.","checks":["Avoid driver memory overload","Spark-side aggregation","Actions vs transformations"]},"minutes":50},{"id":"22","title":"Spark ML estimators, transformers & pipelines","track":"Databricks Associate","level":"Intermediate","domain":"development","summary":"Read and build Spark ML pipelines for distributed model development.","concepts":[{"term":"Spark ML estimator","definition":"An Estimator has fit() and produces a fitted Transformer, such as LogisticRegression.fit() returning LogisticRegressionModel.","example":"pipeline.fit(training_df) yields a PipelineModel."},{"term":"Spark ML transformer","definition":"A Transformer applies transform() to a DataFrame, such as StringIndexerModel, VectorAssembler or a fitted classifier model.","example":"assembler.transform(df) adds a features vector column."},{"term":"VectorAssembler","definition":"Combines numeric input columns into a single Spark vector column typically called features. The downstream estimator consumes this vector and a label column.","example":"Assemble price, prior_units and promotion flags for GBTRegressor."},{"term":"StringIndexer & OneHotEncoder","definition":"Encode string categories into numeric indices, then into indicator vectors as appropriate. Fitting on training data and handling unknown categories avoids production failures.","example":"Index 'market' and encode it before assembling a features vector."},{"term":"CrossValidator","definition":"Spark ML CrossValidator evaluates a parameter grid across folds, then refits best candidate; choose evaluators appropriate to task and budget.","example":"ParamGridBuilder().addGrid(lr.regParam, [0.01, 0.1]).build()."}],"code":"from pyspark.ml import Pipeline\nfrom pyspark.ml.feature import StringIndexer, OneHotEncoder, VectorAssembler\nfrom pyspark.ml.classification import LogisticRegression\nidx = StringIndexer(inputCol='market', outputCol='market_idx', handleInvalid='keep')\nohe = OneHotEncoder(inputCols=['market_idx'], outputCols=['market_vec'])\nvec = VectorAssembler(inputCols=['market_vec','price'], outputCol='features')\nclf = LogisticRegression(labelCol='label', featuresCol='features')\nmodel = Pipeline(stages=[idx, ohe, vec, clf]).fit(training_df)\npred = model.transform(test_df)","lab":{"title":"Hands-on challenge: Spark ML estimators, transformers & pipelines","task":"Explain which pipeline stages call fit and which call transform; propose one quality check before scoring.","solution":"The full Pipeline.fit calls fit on StringIndexer, OneHotEncoder (Spark Estimator), and LogisticRegression, and runs transformations between fits; VectorAssembler transforms directly. PipelineModel.transform applies all fitted stages. Validate schema and unseen categories.","checks":["Estimator vs Transformer","Vector column","Handle unseen categories"]},"minutes":50},{"id":"23","title":"Databricks ML workspace, runtimes & AutoML","track":"Databricks Associate","level":"Intermediate","domain":"platform","summary":"Master the platform features heavily weighted in the ML Associate exam.","concepts":[{"term":"Databricks ML environment","definition":"Databricks integrates notebooks, distributed compute, Delta/Unity Catalog, MLflow, AutoML and Jobs. Choose compute and ML libraries that match project workload and runtime support.","example":"Prototype on interactive compute, orchestrate repeatable training with a job."},{"term":"Databricks Runtime for ML","definition":"An ML-oriented runtime bundles many compatible machine learning libraries and integrations, improving setup reproducibility. Availability and naming depend on current compute options.","example":"Use an ML runtime when you need a curated environment for Python training and MLflow."},{"term":"AutoML","definition":"AutoML automates baseline experimentation, preprocessing/model candidates and reported trials; it complements rather than replaces data understanding and leakage checks.","example":"Generate candidate models for a churn baseline and inspect experiment artifacts."},{"term":"MLOps principles","definition":"Version data/code/models, automate reproducible training and testing, track experiments, govern promotion and monitor drift. Build for repeatability before deployment.","example":"A pull request triggers validation; an approved model version receives an alias for serving."},{"term":"Compute selection","definition":"Single-node models can be trained on driver/workers depending on libraries, while Spark ML supports distributed algorithms. Avoid assuming that adding workers automatically accelerates single-node sklearn.fit.","example":"Use sklearn for moderate data; Spark ML when the computation truly benefits from distribution."}],"code":"# Pseudocode for an AutoML baseline in a Databricks notebook:\n# import databricks.automl as automl\n# summary = automl.classify(dataset=df, target_col='churn', timeout_minutes=30)\n# Inspect generated notebooks, evaluation metrics and MLflow experiments.\n# Check current platform availability and supported API before running.","lab":{"title":"Hands-on challenge: Databricks ML workspace, runtimes & AutoML","task":"Propose the first day of a Databricks churn project: data governance, baseline, experiments, and promotion criteria.","solution":"Read governed Delta tables via Unity Catalog; check labels and leakage; create temporal/group-aware holdout; run an AutoML baseline; compare to manual pipeline in MLflow; agree acceptance metrics before promoting a registered model.","checks":["No blind AutoML trust","Record run artifacts","Check compute suitability"]},"minutes":50},{"id":"24","title":"Unity Catalog & Feature Engineering","track":"Databricks Associate","level":"Advanced","domain":"platform","summary":"Understand feature reuse, account-level governance and consistent training/serving.","concepts":[{"term":"Unity Catalog namespaces","definition":"A governed object is addressed as catalog.schema.object. Central governance across workspaces supports access control, lineage and consistent discoverability.","example":"main.ml.customer_features and main.ml.churn_model."},{"term":"Feature tables & FeatureEngineeringClient","definition":"In the exam's feature-table workflow, create or use Unity Catalog-managed Delta feature tables with primary keys via FeatureEngineeringClient, write feature rows, and construct training sets using lookups.","example":"fe.create_table(name='main.ml.features', primary_keys=['id'], df=features_df, description='...')."},{"term":"Offline vs online features","definition":"Offline feature data supports historical/batch training and scoring; online access is optimized for low-latency retrieval. Ensure definitions and freshness align across paths.","example":"A nightly feature table may be fine for batch demand, not millisecond fraud inference."},{"term":"Feature lookups and leakage","definition":"Training datasets often require time-aware features; joining the latest values to historical labels introduces look-ahead leakage. Point-in-time correctness depends on feature timestamps and selection logic.","example":"For a March churn label, only include feature values available before March cutoff."},{"term":"Feature views & platform updates","definition":"More recent Databricks Feature Store documentation also discusses managed Feature Views alongside feature tables. Learn both the exam guide's feature-table terminology and current authoring paths; verify APIs in active runtime.","example":"Distinguish feature-definition governance from the materialized Delta table."}],"code":"from databricks.feature_engineering import FeatureEngineeringClient, FeatureLookup\nfe = FeatureEngineeringClient()\n# Example; requires an enabled workspace and proper permissions:\nfe.create_table(name='main.ml.customer_features',\n                primary_keys=['customer_id'],\n                df=features_df, description='Reusable features')\nlookups = [FeatureLookup(table_name='main.ml.customer_features',\n                         lookup_key='customer_id',\n                         feature_names=['avg_basket'])]\ntrain = fe.create_training_set(df=labels_df,\n                               feature_lookups=lookups,\n                               label='churn').load_df()","lab":{"title":"Hands-on challenge: Unity Catalog & Feature Engineering","task":"A historical churn table is being joined to current customer features. Explain the leakage and propose a point-in-time safe design.","solution":"Use timestamped features and join only the latest feature record available before each label cutoff. Enforce entity keys, timestamp semantics, late-arrival policy, lineage and consistent serving definitions.","checks":["Identify look-ahead leakage","Maintain table keys","Distinguish offline/online"]},"minutes":50},{"id":"25","title":"MLflow experiments, runs & Client API","track":"Databricks Associate","level":"Advanced","domain":"platform","summary":"Log, compare, reproduce and query machine learning training runs.","concepts":[{"term":"Experiment vs run","definition":"An MLflow experiment groups runs; a run represents one execution with parameters, metrics, artifacts and metadata. Comparison across many runs enables reproducible model selection.","example":"Log each hyperparameter candidate as one run within an experiment."},{"term":"Metrics vs parameters vs artifacts","definition":"Parameters describe configuration; metrics measure outcomes and can vary over steps; artifacts store files, plots and model outputs. Use stable metric names and a defined validation split.","example":"log_param('max_depth',5), log_metric('validation_rmse',4.2), log_artifact('plot.png')."},{"term":"MLflow autologging","definition":"Autologging captures supported estimators' parameters/metrics/models automatically; supplement with custom business metrics and validation context.","example":"mlflow.sklearn.autolog() before training a supported sklearn model."},{"term":"MlflowClient search_runs","definition":"Query runs by experiment and order by a metric. For minimized metrics use ASC, for maximized metrics DESC.","example":"client.search_runs([exp_id], order_by=['metrics.validation_rmse ASC'], max_results=1)[0]."},{"term":"Model signature & environment","definition":"A model artifact should describe its expected input schema and dependencies; signatures and input examples help catch serving mismatches.","example":"Log with an inferred signature and validate incoming feature columns during deployment."}],"code":"import mlflow\nfrom mlflow.tracking import MlflowClient\nmlflow.set_experiment('/Shared/demand-experiments')\nwith mlflow.start_run():\n    mlflow.log_param('model', 'ridge')\n    mlflow.log_metric('validation_rmse', 4.2)\nclient = MlflowClient()\nexp = client.get_experiment_by_name('/Shared/demand-experiments')\nbest = client.search_runs([exp.experiment_id],\n                          order_by=['metrics.validation_rmse ASC'],\n                          max_results=1)[0]\nprint(best.info.run_id)","lab":{"title":"Hands-on challenge: MLflow experiments, runs & Client API","task":"Track three candidate models with comparable splits and retrieve the lowest validation RMSE using the MLflow Client API.","solution":"Use a shared experiment and metric name, record seed/split/version, and retrieve sorted runs using client.search_runs(..., order_by=['metrics.validation_rmse ASC'], max_results=1). Validate that the best run has required artifacts.","checks":["Consistent validation","Correct sort direction","Track artifacts and provenance"]},"minutes":50},{"id":"26","title":"Unity Catalog Model Registry & champion/challenger","track":"Databricks Associate","level":"Advanced","domain":"platform","summary":"Separate versioned model artifacts from release selection using aliases.","concepts":[{"term":"Model Registry","definition":"A registry stores model versions and governance metadata. Unity Catalog model names use three-level identifiers; the legacy workspace registry is not the same governance model.","example":"main.ml.demand_forecaster, version 7."},{"term":"Register model","definition":"MLflow can register a logged model URI into Unity Catalog when correctly configured. Capture signature and environment; access permissions must allow creation and management.","example":"mlflow.register_model(model_uri='runs:/RUN_ID/model', name='main.ml.demand_forecaster')."},{"term":"Aliases","definition":"A mutable alias such as champion points to a specific registered model version. Switch the alias to route callers using an alias-based URI without deleting previous versions.","example":"client.set_registered_model_alias(name, 'champion', version=7)."},{"term":"Tags vs aliases","definition":"Tags store descriptive key/value metadata; aliases identify the selected version. A tag named 'champion' does not automatically redirect inference.","example":"Use a tag 'approved_by' for governance, alias 'champion' for deployment selection."},{"term":"Promoting code vs models","definition":"Promote code when environments differ or rebuilding is desirable; promote a validated model artifact when bit-for-bit consistency of the evaluated object matters, subject to governance controls.","example":"CD pipeline runs the same model across environments or rebuilds using controlled deployment inputs."}],"code":"import mlflow\nfrom mlflow import MlflowClient\nmlflow.set_registry_uri('databricks-uc')\nname = 'main.ml.demand_forecaster'\n# After registering a run and obtaining its version:\nclient = MlflowClient()\nclient.set_registered_model_alias(name, 'champion', '7')\nmodel_uri = f'models:/{name}@champion'\nprint('Resolve serving model:', model_uri)","lab":{"title":"Hands-on challenge: Unity Catalog Model Registry & champion/challenger","task":"A new model version beats production. Explain how to promote it safely without using legacy stages.","solution":"Compare champion and challenger on held-out validation, approve and record checks, set the Unity Catalog registered-model alias 'champion' to the new version via MlflowClient, canary-test and retain rollback path.","checks":["Use alias not legacy Production stage","Governance checks","Rollback readiness"]},"minutes":50},{"id":"27","title":"Batch, streaming & real-time inference","track":"Databricks Associate","level":"Advanced","domain":"deployment","summary":"Select an inference architecture by latency, throughput and freshness.","concepts":[{"term":"Batch inference","definition":"Scores many records at scheduled intervals, often using pandas/Spark and stored output tables. Simplest for nightly or weekly decisions with no per-request latency requirement.","example":"Compute all retailers' suggested orders at 2 a.m."},{"term":"Streaming inference","definition":"Applies predictions continuously to events or micro-batches as data arrives. Spark Structured Streaming/Lakeflow pipelines can handle high throughput and stateful time windows.","example":"Detect anomalies in a 10-minute window of machine telemetry."},{"term":"Real-time serving","definition":"Exposes an API for per-request inference where latency matters. Databricks Model Serving endpoints can serve registered models with managed infrastructure and monitoring.","example":"Predict account risk while a transaction is submitted."},{"term":"Traffic splitting","definition":"Endpoint configuration can route portions of requests between served models for controlled rollout. Monitor latency, success and model quality before switching traffic.","example":"Route 10% to challenger for shadow/canary comparisons when supported."},{"term":"Batch scoring with pandas","definition":"Load the same model flavor used during training, validate feature schema and call predict on a batch DataFrame. Store predictions with model version and data timestamp.","example":"mlflow.pyfunc.load_model('models:/main.ml.model@champion').predict(pdf)."}],"code":"import mlflow\n# In an authenticated Databricks environment with UC access:\nmodel = mlflow.pyfunc.load_model('models:/main.ml.demand_forecaster@champion')\n# pdf: pandas.DataFrame matching model input signature\npreds = model.predict(pdf)\npdf['prediction'] = preds\n# Write scoring metadata and predictions to Delta table.","lab":{"title":"Hands-on challenge: Batch, streaming & real-time inference","task":"Choose architectures for (1) nightly customer scoring, (2) per-click fraud decisions, and (3) continuously arriving sensor events.","solution":"(1) Scheduled batch inference. (2) Low-latency serving endpoint. (3) Streaming inference in a managed streaming pipeline. Explain operational, cost and freshness requirements for each.","checks":["Latency-driven choice","Schema validation","Monitoring/rollback"]},"minutes":50},{"id":"28","title":"Databricks Jobs, releases & MLOps","track":"Databricks Associate","level":"Advanced","domain":"deployment","summary":"Turn notebooks into controlled production systems.","concepts":[{"term":"Orchestration","definition":"A production ML workflow links validation, feature creation, training, registration, scoring and monitoring with explicit dependencies, retries and alerts.","example":"A daily job fails if today's feature table is empty instead of serving stale predictions."},{"term":"CI/CD & environment promotion","definition":"Test source code and data contracts in CI; use deployment automation to release reproducibly. Databricks product terminology changes; newer docs refer to Declarative Automation Bundles and Lakeflow Jobs.","example":"Deploy jobs/models across dev, staging and prod with configuration differences."},{"term":"Monitoring & rollback","definition":"Track data quality, feature freshness, endpoint latency, prediction drift and labeled performance; plan a prior model version rollback.","example":"Alert if feature null rates increase 5× over the 30-day reference."},{"term":"Lineage & permissions","definition":"Unity Catalog and tracked MLflow artifacts help link data to model versions. Enforce least-privilege read/write permissions and secure credentials outside code.","example":"Production serving can read only approved feature tables and model versions."},{"term":"Reusable components","definition":"Parameterized notebooks/modules and stable schemas are easier to test than copying notebook code across teams.","example":"One validated feature function runs in both training and batch scoring jobs."}],"code":"# Pseudocode for a job DAG:\n# [validate_input] -> [build_features] -> [train/evaluate]\n#                                     -> [approval] -> [register/promote]\n#                                     -> [batch_score] -> [monitor]\n# Add retries/alerts, feature freshness checks, versioned artifacts,\n# and an explicit rollback target.","lab":{"title":"Hands-on challenge: Databricks Jobs, releases & MLOps","task":"Design a production ML job with task dependencies, idempotency, fail-fast controls and a rollback plan.","solution":"Build DAG with validate -> transform -> train -> evaluate -> conditional promote -> score -> monitor. Use stable output partitions, dataset/model versions, schema checks, approval gate, least privilege and retryable idempotent writes.","checks":["Explicit dependencies","Idempotent jobs","Rollback and alerts"]},"minutes":50},{"id":"29","title":"Production monitoring & reliability","track":"Advanced Topics","level":"Advanced","domain":null,"summary":"Detect model deterioration and maintain system quality beyond deployment.","concepts":[{"term":"Data drift","definition":"A change in input feature distribution between reference and serving data. Drift may or may not hurt performance; detect with statistical tests and operational thresholds.","example":"Promotion mix shifts from 10% to 60% of transactions."},{"term":"Concept drift","definition":"Relationship between features and target changes, reducing relevance of learned patterns. Requires labeled outcomes to confirm reliably.","example":"The same discount now drives fewer extra sales because of competitor behavior."},{"term":"Training-serving skew","definition":"Input generation differs across training and live inference, leading to unexpected performance drops. Shared transformations, contracts and tests reduce skew.","example":"A production service uses tax-inclusive prices while training used tax-exclusive prices."},{"term":"Model observability","definition":"Track validity, latency, throughput, resource cost, prediction distribution and delayed ground-truth performance. Alert on meaningful decision criteria rather than every numerical change.","example":"Measure MAE by store segment every week after labels arrive."},{"term":"Retraining strategy","definition":"Trigger periodic or event-driven training with checks, not auto-promote every new candidate. A newer model is not automatically better.","example":"Retrain monthly, compare to champion, deploy only after threshold checks."}],"code":"# Example monitor logic (illustrative)\nnull_rate = today_features['price'].isna().mean()\nif null_rate > 0.05:\n    raise RuntimeError('Price feature null rate above 5%')\n# Additional checks: schema, reference drift, per-segment MAE,\n# data freshness, endpoint failures and model-version labels.","lab":{"title":"Hands-on challenge: Production monitoring & reliability","task":"A production demand model degrades after a pricing-system update. Create a troubleshooting sequence.","solution":"Verify data contracts and changed price semantics; compare train/serve distributions; validate label delay and segment error; re-run old model on affected data; repair transformations, backfill if needed, and only then consider retraining and controlled promotion.","checks":["Check training-serving skew first","Use versioned evidence","Controlled response"]},"minutes":50},{"id":"30","title":"Generative AI, RAG & LLM evaluation","track":"Advanced Topics","level":"Advanced","domain":null,"summary":"Expand beyond the Associate blueprint into modern ML engineering.","concepts":[{"term":"Retrieval-Augmented Generation (RAG)","definition":"Retrieves grounded passages and supplies them to a language model at generation time. Retrieval quality and answer faithfulness must be evaluated separately.","example":"Retrieve policy snippets before the assistant answers a customer question."},{"term":"Chunking & embedding retrieval","definition":"Split source content into retrievable units, embed/index them and retrieve top-k candidates; chunk boundaries and metadata filters affect results.","example":"Split long manuals by headings and evaluate retrieval recall at k."},{"term":"Reranking","definition":"A second-stage ranker reorders candidate passages by query relevance, often improving precision at added latency and cost.","example":"Retrieve 30 documents by vectors, rerank top 5 for context."},{"term":"LLM evaluation","definition":"Evaluate factual grounding, relevance, safety, latency and cost with representative labeled examples and human checks. Automated model-based judgments need calibration.","example":"Test that a finance agent answers using a dated metric and cites the correct source."},{"term":"Prompt injection & governance","definition":"Retrieved documents may contain malicious instructions; treat retrieved content as untrusted data, enforce tool access boundaries and protect sensitive records.","example":"Never let a retrieved wiki page override system-level data access constraints."}],"code":"# Minimal retrieval pseudocode; not an LLM call:\n# chunks = split_documents(docs, keep_metadata=True)\n# vectors = embedding_model.encode([c.text for c in chunks])\n# index.add(vectors)\n# passages = index.search(query_vector, top_k=5)\n# answer = llm.generate(question, context=passages)\n# Evaluate retrieval and generation separately.","lab":{"title":"Hands-on challenge: Generative AI, RAG & LLM evaluation","task":"Sketch an evaluation set for a finance RAG agent with 25 scenarios; specify retrieval, correctness and injection checks.","solution":"Include cases with exact KPI retrieval, date/currency filters, missing evidence and adversarial instructions. Grade retrieval recall@k, supported factual accuracy, citation correctness, refusal/abstention when evidence absent, latency and cost.","checks":["Separate retrieval from response quality","Data access controls","Test grounded answers"]},"minutes":50},{"id":"31","title":"Spark ML at enterprise scale","track":"Databricks Professional","level":"Expert","domain":"pro_development","summary":"Decide when distributed Spark ML is appropriate and how to scale group-specific models.","concepts":[{"term":"Distributed Spark ML tradeoffs","definition":"Spark ML fits models on partitioned DataFrames, useful for large data and algorithms with distributed implementations. Moving a moderate dataset to a single machine can be faster than distributed startup and shuffles.","example":"Use SparkML on hundreds of millions of rows rather than collect() into a pandas estimator."},{"term":"Spark ML tuning and evaluation","definition":"ParamGridBuilder, CrossValidator, TrainValidationSplit, and the right Evaluator allow model selection at scale. Control parallelism and shuffle cost when each candidate model is expensive.","example":"Tune a Spark GBTRegressor with RegressionEvaluator(metricName='rmse')."},{"term":"Pandas grouped UDFs and applyInPandas","definition":"Grouped pandas functions run independent Python computation per group on workers and return data matching a declared Spark schema. A group may need to fit wholly in a worker's memory.","example":"Train one demand model for each retailer using groupBy('retailer').applyInPandas(...)."},{"term":"Single-node vs distributed inference","definition":"Choose the architecture based on model flavor, data volume, latency and cost. Batch Spark transformations differ from serving a single Python model at a REST endpoint.","example":"Score 300 million events with Spark ML on a schedule; score individual requests through an API."},{"term":"Data partition skew","definition":"Parallel workers can be underutilized when one group owns much more data than others. Profile key cardinality and partition distribution before scaling.","example":"One high-volume retailer dominates groupBy training and causes a single slow task."}],"code":"from pyspark.ml import Pipeline\nfrom pyspark.ml.regression import GBTRegressor\nfrom pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.evaluation import RegressionEvaluator\nfrom pyspark.ml.tuning import CrossValidator, ParamGridBuilder\nassembler = VectorAssembler(inputCols=['price','lag_1'], outputCol='features')\ngbt = GBTRegressor(featuresCol='features', labelCol='label')\npipe = Pipeline(stages=[assembler, gbt])\ngrid = ParamGridBuilder().addGrid(gbt.maxDepth, [3,5]).build()\ncv = CrossValidator(estimator=pip
