function lesson(){const m=item(UI.module)||COURSE[0],read=modRead(m);return `<button class="back-link" data-action="nav" data-page="learn">${ic('back')} All modules</button><div class="lesson-hero"><div><div class="eyebrow">MODULE ${m.id} · ${esc(m.track)} · ${esc(m.level)}</div><h1>${esc(m.title)}</h1><p class="lead">${esc(m.summary)}</p></div><div style="min-width:155px">${tag(`${read}/${m.concepts.length} concepts read`,'purple')}<div style="margin-top:12px">${rowprogress(read,m.concepts.length)}</div></div></div><div class="lesson-actions">${button('modulequiz',`${ic('quiz')} Test this topic`,'primary',`data-id="${m.id}"`)}${button('lab',`${ic('lab')} Open coding lab`,'',`data-id="${m.id}"`)}${button('research',`${ic('external')} Find real examples`,'',`data-text="${esc(m.title)}"`)}</div><div class="section"><h2>Core concepts</h2><span class="subtle">Study each section, then mark it read.</span></div><div class="concept-list">${m.concepts.map((c,i)=>`<article class="concept-card ${P.concepts[m.id+'-'+i]?'read':''}"><div class="concept-num">${String(i+1).padStart(2,'0')} / 0${m.concepts.length} · ESSENTIAL TERM</div><h3 class="concept-title">${esc(c.term)}</h3><p>${esc(c.definition)}</p><div class="example"><strong>REAL-WORLD EXAMPLE</strong> &nbsp; ${esc(c.example)}</div><div class="concept-tools">${button('read',P.concepts[m.id+'-'+i]?`${ic('check')} Read`:`${ic('checkcircle')} Mark as read`,P.concepts[m.id+'-'+i]?'small good':'small',`data-key="${m.id}-${i}"`)}</div></article>`).join('')}</div><div class="section"><h2>Python / SQL reference</h2>${tag('Copy-ready code')}</div><p class="subtle">Illustrative snippets may require packages, a dataset, Databricks permissions, or contextual variables. They are not executed in the browser.</p>${codebox(m.code,'REFERENCE EXAMPLE',m.id+'-code')}<div class="section"><h2>Check your understanding</h2></div><div class="panel"><h3>${esc(m.lab.title)}</h3><p style="font-size:13px">${esc(m.lab.task)}</p><div class="two-actions">${button('lab',`${ic('lab')} Solve the challenge`,'primary',`data-id="${m.id}"`)}${button('modulequiz',`${ic('quiz')} Answer topic questions`,'',`data-id="${m.id}"`)}</div></div><div class="section"><h2>Continue learning</h2></div><div class="two-actions">${m.id!=='01'?button('module',`${ic('back')} Previous module`,'',`data-id="${String(Number(m.id)-1).padStart(2,'0')}"`):''}${m.id!=='37'?button('module',`Next module ${ic('arrow')}`,'primary',`data-id="${String(Number(m.id)+1).padStart(2,'0')}"`):''}</div>`}
function codebox(code,title,id){return `<div class="codebox"><div class="codehead"><span>${esc(title)}</span><button class="codecopy" data-action="copycode" data-code="${esc(id)}">${ic('copy')} Copy</button></div><pre><code>${esc(code)}</code></pre></div>`}
function practiceSetup(){const total=QUESTIONS.length,weak=weakQuestions().length;return `<div class="eyebrow">ACTIVE RECALL & APPLIED REASONING</div><h1>Knowledge checks, not guesswork.</h1><p class="lead">${total} hand-written multiple-choice questions, realistic debugging scenarios and select-two items. Get explanations immediately and revisit every mistake.</p>${P.quiz?`<div class="panel" style="border-color:var(--accent);margin-bottom:18px"><h3>Unfinished ${P.quiz.mode.startsWith('exam')?'mock examination':'practice session'}</h3><p>${P.quiz.items.length} questions · progress saved automatically. ${P.quiz.mode.startsWith('exam')?'The exam clock continues while the session is open.':''}</p>${button('resumequiz','Resume session','primary')}${button('abandon','Discard session','danger small')}</div>`:''}<div class="panel quiz-setup"><h2>Build a practice session</h2><p class="subtle">Use filters to drill a domain or test practical reasoning. For a full-length weighted mock exam, use the Certification hub.</p><div class="quiz-grid"><div class="field"><label for="quizdomain">Topic / exam domain</label><select class="select" id="quizdomain"><option value="all">All topics</option><option value="mistakes">Previously missed questions (${weak})</option>${[...DOMAINS,...PRO_DOMAINS].map(d=>`<option value="${d.id}" ${UI.setupDomain===d.id?'selected':''}>${esc(d.label)} (${QUESTIONS.filter(q=>q.domain===d.id).length})</option>`).join('')}${COURSE.map(m=>`<option value="m${m.id}" ${UI.setupDomain==='m'+m.id?'selected':''}>${m.id}. ${esc(m.title)}</option>`).join('')}</select></div><div class="field"><label for="quizkind">Question style</label><select class="select" id="quizkind"><option value="all">Theory + practical + select-two</option><option value="theory" ${UI.setupKind==='theory'?'selected':''}>Theory / definitions</option><option value="applied" ${UI.setupKind==='applied'?'selected':''}>Scenarios / applied practice</option></select></div><div class="field"><label for="quizcount">Session length</label><select class="select" id="quizcount"><option value="10" ${UI.setupCount==='10'?'selected':''}>Quick · up to 10 questions</option><option value="20" ${UI.setupCount==='20'?'selected':''}>Focused · up to 20 questions</option><option value="40" ${UI.setupCount==='40'?'selected':''}>Intensive · up to 40 questions</option><option value="all" ${UI.setupCount==='all'?'selected':''}>Entire filtered question bank</option></select></div><div class="field"><label>Question bank snapshot</label><div class="callout">${QUESTIONS.length} unique questions · ${QUESTIONS.filter(q=>q.answer.length>1).length} select-two · ${QUESTIONS.filter(q=>q.kind==='practical').length} applied code/scenarios</div></div></div><div class="two-actions" style="margin-top:24px">${button('startpractice',`${ic('lightning')} Start practice`,'primary')}${button('missed',`${ic('target')} Review errors`,'')}</div></div><div class="section"><h2>How to use these questions</h2></div><div class="plan-cols"><div class="plan-card"><h3>Learn → Recall → Apply</h3><p>Read a module, answer its targeted questions, and solve the lab. Revisit incorrect items instead of rereading everything.</p></div><div class="plan-card"><h3>Certification realism</h3><p>Select-two questions require both correct options. Mock exams hide feedback until submission and reproduce the official domain weights.</p></div></div>`}
function makeQuiz(ids,mode='practice'){if(P.quiz){toast('Finish or discard the existing session first.');navigate('quiz');return}const list=ids.map(id=>({id,order:shuffle([0,1,2,3]),selected:[],submitted:false}));if(!list.length){toast('No questions available for these filters.');return}P.quiz={mode,items:list,index:0,started:Date.now(),deadline:mode.startsWith('exam')?Date.now()+(mode==='exam-professional'?120:90)*60000:null};save();navigate('quiz')}
function startPractice(){let pool=QUESTIONS.filter(q=>UI.setupDomain==='all'||(UI.setupDomain==='mistakes'&&P.questionStats[q.id]?.wrong>0)||(UI.setupDomain.startsWith('m')?q.module===UI.setupDomain.slice(1):q.domain===UI.setupDomain));if(UI.setupKind!=='all')pool=pool.filter(q=>UI.setupKind==='theory'?q.kind==='theory':q.kind!=='theory');if(!pool.length){toast('No matching questions. Change the filters.');return}const count=UI.setupCount==='all'?pool.length:Number(UI.setupCount);makeQuiz(shuffle(pool).slice(0,count).map(q=>q.id))}
function startExam(level='associate'){const ids=[];const domains=level==='professional'?PRO_DOMAINS:DOMAINS;for(const d of domains){const qs=shuffle(QUESTIONS.filter(q=>q.domain===d.id));if(qs.length<d.count){toast(`Insufficient questions in ${d.label}.`);return}ids.push(...qs.slice(0,d.count).map(q=>q.id))}makeQuiz(shuffle(ids),'exam-'+level)}
function qState(){const s=P.quiz;if(!s)return null;return {s,it:s.items[s.index],q:qById.get(s.items[s.index].id)}}
function timeLeft(deadline){if(!deadline)return '';const secs=Math.max(0,Math.ceil((deadline-Date.now())/1000));return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function quizView(){if(!P.quiz)return `<div class="empty"><h3>No active test</h3>${button('nav','Build a practice session','primary',`data-page="practice"`)}</div>`;const {s,it,q}=qState();const progress=s.mode.startsWith('exam')?s.items.filter(x=>x.selected.length>0).length:s.items.filter(x=>x.submitted).length;const multiple=q.answer.length>1;const checked=it.selected;const answered=it.submitted;const correct=it.order.map((orig,i)=>q.answer.includes(orig)?i:-1).filter(n=>n>=0);const right=answered&&checked.length===correct.length&&correct.every(n=>checked.includes(n));return `<div class="quiz-container"><div class="quiz-top"><div><div class="eyebrow">${s.mode.startsWith('exam')?(s.mode==='exam-professional'?'PROFESSIONAL · BLUEPRINT-ALIGNED MOCK':'ASSOCIATE · BLUEPRINT-ALIGNED MOCK'):'PERSONALIZED PRACTICE SESSION'}</div><div class="subtle">Question ${s.index+1} of ${s.items.length} · ${s.mode.startsWith('exam')?`${s.items.length} scored items · no feedback until results`:'Immediate feedback mode'}</div></div><div class="two-actions">${s.mode.startsWith('exam')?`<span class="tag warn" id="exam-timer">${ic('clock')} ${timeLeft(s.deadline)}</span>`:''}${button('quitquiz','Exit','small')}</div></div>${rowprogress(progress,s.items.length)}<div class="quiz-card" style="margin-top:18px"><div class="labelled">${tag(`${multiple?'SELECT TWO':'SELECT ONE'}`,'purple')}${tag(q.domain?[...DOMAINS,...PRO_DOMAINS].find(x=>x.id===q.domain)?.label||'Advanced ML':'General ML','')}${tag(q.kind==='practical'?'Applied':q.kind==='scenario'?'Scenario':'Theory')}</div><div class="quiz-prompt">${esc(q.prompt)}</div><div class="choices">${it.order.map((orig,i)=>{const selected=checked.includes(i),good=correct.includes(i);return `<button class="choice ${selected?'selected':''} ${answered?(good?'correct':(selected?'incorrect':'')):''}" data-action="selectchoice" data-opt="${i}" ${answered?'disabled':''} aria-pressed="${selected}"><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${esc(q.options[orig])}</span>${answered&&good?`<span style="margin-left:auto;color:var(--good)">${ic('check')}</span>`:''}</button>`}).join('')}</div>${answered?`<div class="explanation"><strong>${right?'Correct — excellent reasoning.':'Review the reasoning.'}</strong><p>${esc(q.explanation)}</p>${!right?`<p><strong>Correct answer${multiple?'s':''}:</strong> ${correct.map(i=>String.fromCharCode(65+i)).join(' + ')} · ${correct.map(i=>esc(q.options[it.order[i]])).join('; ')}</p>`:''}</div>`:''}<div class="quiz-bottom"><div class="quiz-progress">${s.mode.startsWith('exam')?`${s.items.filter(x=>x.selected.length).length} answered / ${s.items.length}`:`${s.items.filter(x=>x.submitted).length} checked / ${s.items.length}`}</div><div class="two-actions">${s.index>0?button('prevquestion','Previous','small'):''}${s.mode==='practice'&&!answered?button('checkanswer','Check answer','primary',!checked.length?'disabled':''):s.mode==='practice'?button('nextquestion',s.index===s.items.length-1?'See results':'Next question','primary'):button('nextquestion',s.index===s.items.length-1?'Finish exam':'Next','primary')}</div></div></div>${s.mode.startsWith('exam')?`<p class="subtle" style="margin-top:18px;text-align:center">Questions may be changed before finishing. The timer is continuous, including when this page is closed.</p>`:''}</div>`}
function recordAnswer(id,correct){P.questionStats[id]??={right:0,wrong:0};P.questionStats[id][correct?'right':'wrong']++;P.xp+=(correct?10:2);bump('questions')}
function choiceSelect(i){const x=qState();if(!x)return;if(x.it.submitted)return;const multiple=x.q.answer.length>1;const sel=x.it.selected;const exists=sel.includes(i);if(exists)sel.splice(sel.indexOf(i),1);else if(multiple&&sel.length<2)sel.push(i);else if(!multiple){sel.splice(0,sel.length,i)}save();render()}
function checkAnswer(){const z=qState();if(!z||!z.it.selected.length)return;const correct=z.it.selected.length===z.q.answer.length&&z.it.selected.every(idx=>z.q.answer.includes(z.it.order[idx]));z.it.submitted=true;recordAnswer(z.q.id,correct);save();render()}
function moveQuestion(step){if(!P.quiz)return;const s=P.quiz;if(s.mode.startsWith('exam')&&s.index+step<0)return;if(s.index+step>=s.items.length){if(s.mode.startsWith('exam')&&s.items.filter(x=>x.selected.length>0).length<s.items.length&&!confirm('Some questions are unanswered. Finish and score the exam now?'))return;finishQuiz();return}s.index=Math.max(0,s.index+step);save();render();window.scrollTo({top:0,behavior:'instant'})}
function finishQuiz(){if(!P.quiz)return;const s=P.quiz;let score=0;const answers=s.items.map(it=>{const q=qById.get(it.id);const ok=it.selected.length===q.answer.length&&it.selected.every(ix=>q.answer.includes(it.order[ix]));if(ok)score++;if(s.mode.startsWith('exam'))recordAnswer(q.id,ok);return {id:it.id,selected:it.selected,order:it.order,correct:ok}});let domains=s.mode==='exam-professional'?PRO_DOMAINS:DOMAINS;let breakdown=domains.map(d=>{const subset=answers.filter(a=>qById.get(a.id).domain===d.id);return {domain:d.id,score:subset.filter(a=>a.correct).length,total:subset.length}});const result={mode:s.mode,score,total:s.items.length,date:Date.now(),duration:Math.floor((Date.now()-s.started)/1000),breakdown,answers};P.sessions.unshift(result);P.sessions=P.sessions.slice(0,40);P.quiz=null;P.xp+=s.mode.startsWith('exam')?40:15;save();navigate('results',{results:result})}
function results(){const r=UI.results||P.sessions[0];if(!r)return `<div class="empty"><h3>No results yet</h3>${button('nav','Take a practice test','primary',`data-page="practice"`)}</div>`;const p=pct(r.score,r.total),isExam=r.mode.startsWith('exam'),ready=p>=80&&r.breakdown.filter(d=>d.total>0).every(d=>pct(d.score,d.total)>=70);return `<div class="quiz-container"><div class="eyebrow">${isExam?'MOCK EXAM REPORT':'PRACTICE SESSION COMPLETE'}</div><h1>${isExam?'Certification readiness review':'Great work—now refine weak spots.'}</h1><div class="panel" style="text-align:center"><div class="score-circle"><div><strong>${p}%</strong><div><small>${r.score} / ${r.total}</small></div></div></div><h2>${isExam?(ready?'You met the app’s study target.':'Keep strengthening the weaker domains.'):p>=80?'Strong session performance.':'Use the missed-question review next.'}</h2><p>${isExam?'Personal study target: 80% overall and at least 70% in each domain. These are NOT official Databricks passing thresholds.':'Every question is tracked. Incorrect answers will appear in the mistakes drill.'}</p><div class="two-actions" style="justify-content:center">${button('nav',`${ic('quiz')} New practice`,'primary',`data-page="practice"`)}${button('missed',`${ic('target')} Retry mistakes`,'')}${isExam?button('openexam',`${ic('cert')} Another mock`,''):''}</div></div>${r.breakdown.some(x=>x.total)?`<div class="section"><h2>Performance by certification domain</h2></div><div class="panel">${r.breakdown.filter(x=>x.total).map(x=>{const d=[...DOMAINS,...PRO_DOMAINS].find(d=>d.id===x.domain);return `<div class="domain-item"><div class="domain-name"><strong>${esc(d.label)}</strong><span>${x.score}/${x.total} · ${pct(x.score,x.total)}%</span></div>${rowprogress(x.score,x.total)}</div>`}).join('')}</div>`:''}<div class="section"><h2>Answer review & explanations</h2><span class="subtle">Expand any question for a full explanation</span></div><div class="review-answers">${r.answers.map((a,i)=>{const q=qById.get(a.id);const correct=q.answer.map(orig=>esc(q.options[orig])).join(' + ');const mine=a.selected.map(ix=>esc(q.options[a.order[ix]])).join(' + ')||'Unanswered';return `<details><summary><span class="${a.correct?'success':'error'}">${a.correct?'✓':'✕'} </span>${i+1}. ${esc(q.prompt)}</summary><p><b>Your answer:</b> ${mine}</p><p><b>Correct answer:</b> ${correct}</p><p>${esc(q.explanation)}</p><div>${button('module',`Study module ${q.module}`,'small',`data-id="${q.module}"`)}</div></details>`}).join('')}</div></div>`}
function labs(){let matches=COURSE.filter(m=>!UI.labSearch||[m.title,m.lab.task].join(' ').toLowerCase().includes(UI.labSearch.toLowerCase()));return `<div class="eyebrow">LEARN BY BUILDING</div><h1>${COURSE.length} guided coding laboratories.</h1><p class="lead">Work in VS Code, Jupyter, Google Colab or Databricks. Define an approach, write code, then reveal the reference solution and verify the checklist.</p><div class="toolbar"><input id="labsearch" class="input" type="search" placeholder="Find a coding challenge…" value="${esc(UI.labSearch)}"/>${tag(`${Object.values(P.labs).filter(Boolean).length}/${COURSE.length} completed`,'green')}</div><div class="module-list">${matches.map(m=>`<div class="module-card" data-action="lab" data-id="${m.id}" role="button" tabindex="0"><div class="module-head">${tag(`LAB ${m.id}`)}${P.labs[m.id]?tag('Completed','green'):tag(m.level)}</div><div class="module-title">${esc(m.title)}</div><p class="module-desc">${esc(m.lab.task)}</p><div class="module-foot">Read, implement and self-check <span>${ic('arrow')}</span></div></div>`).join('')}</div>`}
function labView(){const m=item(UI.module)||COURSE[0],l=m.lab;return `<button class="back-link" data-action="nav" data-page="labs">${ic('back')} All coding labs</button><div class="eyebrow">HANDS-ON LAB ${m.id} · ${esc(m.level)}</div><h1>${esc(l.title)}</h1><p class="lead">Solve the problem yourself before looking at the solution. Take your working code into a notebook or Databricks workspace.</p><div class="lab-card"><div class="lab-header"><h3>Challenge brief</h3>${P.labs[m.id]?tag('Completed','green'):tag('In progress')}</div><p>${esc(l.task)}</p><div class="section" style="margin-top:22px"><h3>Acceptance checklist</h3></div><ul>${l.checks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="lab-card"><h3>Related study example</h3>${codebox(m.code,'STARTING REFERENCE',m.id+'-code')}<details><summary>Reveal the reference solution and explanation</summary>${codebox(l.solution,'SUGGESTED SOLUTION',m.id+'-solution')}<p class="subtle">The reference is one possible approach, not executable grading. Verify the checklist and test your own implementation with real data.</p></details></div><div class="lab-card"><h3>Your working notes</h3><p class="subtle">Save assumptions, snippets, errors and conclusions. Notes are stored on this device; export a backup to move them to another device.</p><textarea class="textarea" id="labnotes" data-id="${m.id}" placeholder="Write your solution notes, assumptions and observations here…">${esc(P.notes[m.id]||'')}</textarea><div class="lab-controls">${button('labdone',P.labs[m.id]?`${ic('check')} Completed · undo`:`${ic('checkcircle')} Mark lab complete`,P.labs[m.id]?'good':'primary',`data-id="${m.id}"`)}${button('module',`${ic('book')} Study lesson`,'',`data-id="${m.id}"`)}${button('research',`${ic('external')} Find similar notebooks`,'',`data-text="${esc(m.title)}"`)}</div></div><div class="two-actions">${m.id!=='01'?button('lab','Previous lab','',`data-id="${String(Number(m.id)-1).padStart(2,'0')}"`):''}${m.id!=='37'?button('lab','Next lab','primary',`data-id="${String(Number(m.id)+1).padStart(2,'0')}"`):''}</div>`}
function flashcards(){let due=dueList(),c=UI.flashKey?byKey.get(UI.flashKey):null;if(!c||!due.some(x=>x.key===c.key)){c=due.length?due[0]:allConcepts[0];UI.flashKey=c.key;UI.flashFlipped=false}const current=P.flash[c.key];return `<div class="eyebrow">LONG-TERM RECALL</div><h1>English terminology flashcards.</h1><p class="lead">Study ${allConcepts.length} essential terms with a simple spaced-repetition schedule. Read the term out loud, explain it in English, flip the card, then grade how well you recalled it.</p><div class="statgrid" style="margin-bottom:23px"><div class="statcard"><div class="stat-label">Total cards</div><div class="statnum">${allConcepts.length}</div></div><div class="statcard"><div class="stat-label">Due for review</div><div class="statnum">${due.length}</div></div><div class="statcard"><div class="stat-label">Seen before</div><div class="statnum">${Object.keys(P.flash).length}</div></div><div class="statcard"><div class="stat-label">Reviewed today</div><div class="statnum">${P.activities[dateKey()]?.cards||0}</div></div></div>${due.length===0?`<div class="empty"><h3>All caught up!</h3><p>No cards due right now. Come back when your review intervals expire, or explore the full glossary.</p>${button('nav','Browse all terms','primary',`data-page="glossary"`)}</div>`:`<div class="flash-area"><div class="labelled"><span class="tag purple">${esc(c.modTitle)}</span><span class="subtle">${due.length} due · ${current?`${current.reps} reviews`: 'New term'}</span></div><div class="flash-card ${UI.flashFlipped?'back':''}" data-action="flip" role="button" tabindex="0"><div class="eyebrow">${UI.flashFlipped?'DEFINITION & APPLICATION':'RECALL THIS ENGLISH TERM'}</div><b>${esc(c.term)}</b>${UI.flashFlipped?`<p>${esc(c.definition)}</p><div class="example" style="max-width:580px;text-align:left;margin-top:12px"><strong>EXAMPLE</strong> · ${esc(c.example)}</div>`:`<p>Explain the term and give a concrete ML example.<br><span class="tiny">Tap the card to reveal the answer.</span></p>`}</div>${UI.flashFlipped?`<div class="gradebar">${[['again','Again · 5 min'],['hard','Hard · 1 day'],['good','Good'],['easy','Easy']].map(([a,t])=>button('grade',t,a==='again'?'danger':a==='good'?'primary':'',`data-rating="${a}"`)).join('')}</div>`:`<div class="gradebar">${button('flip','Show answer','primary')}</div>`}<div class="subtle" style="text-align:center;margin-top:17px">Spaced intervals are a lightweight study aid, not a validated assessment of expertise.</div></div>`}`}
function gradeCard(rating){let c=byKey.get(UI.flashKey);if(!c)return;let s=P.flash[c.key]||{reps:0,interval:0,due:0};if(rating==='again'){s.interval=0;s.due=Date.now()+5*60*1000;s.reps=0}else if(rating==='hard'){s.interval=1;s.due=Date.now()+86400000;s.reps++}else if(rating==='good'){s.interval=s.reps===0?1:s.reps===1?3:Math.max(7,Math.round(s.interval*2.3));s.reps++;s.due=Date.now()+s.interval*86400000}else{s.interval=s.reps===0?4:Math.max(7,Math.round(s.interval*3));s.reps++;s.due=Date.now()+s.interval*86400000}P.flash[c.key]=s;P.xp+=3;bump('cards');UI.flashKey=null;UI.flashFlipped=false;save();render()}
function glossary(){let terms=allConcepts.filter(c=>!UI.wordSearch||[c.term,c.definition,c.example,c.modTitle].join(' ').toLowerCase().includes(UI.wordSearch.toLowerCase()));return `<div class="eyebrow">YOUR ENGLISH TECHNICAL DICTIONARY</div><h1>${allConcepts.length} terms. Learn to think in English.</h1><p class="lead">Definitions and realistic usage examples written in English. Search common ML vocabulary, then jump into the full lesson or review as a flashcard.</p><div class="toolbar"><input id="wordsearch" class="input" type="search" placeholder="Search terms: leakage, RMSE, MLflow..." value="${esc(UI.wordSearch)}"/>${tag(`${terms.length} terms`,'purple')}</div><div class="glossary-list">${terms.map(c=>`<div class="glossary-item"><strong>${esc(c.term)}</strong><p>${esc(c.definition)}</p><div class="module-foot"><small>${esc(c.modTitle)}</small><button class="btn small" data-action="module" data-id="${c.module}">Read lesson ${ic('chevron')}</button></div></div>`).join('')}</div>${terms.length?'':`<div class="empty">No matching term found.</div>`}`}
function certHub(){const associate=P.sessions.filter(x=>x.mode==='exam-associate'||x.mode==='exam'),professional=P.sessions.filter(x=>x.mode==='exam-professional');const snapshot=(runs)=>`<span class="tag green">${runs.length} mocks · best ${runs.length?Math.max(...runs.map(x=>pct(x.score,x.total)))+'%':'—'}</span>`;const domainPanel=(ds)=>`<div class="panel">${ds.map(d=>{const x=questionCounts(d.id);return `<div class="domain-item"><div class="domain-name"><strong>${esc(d.label)}</strong><span>${d.weight}% · ${d.count} mock Qs · ${x.percentage??'—'}% practice</span></div>${rowprogress(x.percentage??0,100)}<div class="two-actions" style="margin-top:8px">${button('domainquiz','Drill domain','small',`data-domain="${d.id}"`)}${tag(`${QUESTIONS.filter(q=>q.domain===d.id).length} bank questions`)}</div></div>`}).join('')}</div>`;return `<div class="eyebrow">OFFICIAL-BLUEPRINT-ALIGNED CERTIFICATION PRACTICE</div><h1>Associate. Professional. Your choice.</h1><p class="lead">Two independent exam simulators, based on the published August 2026 exam guides. Both use original, self-written practice questions, not official exam items. No numeric passing score is published by Databricks.</p><div class="twocol"><div class="panel" style="background:linear-gradient(155deg,var(--surface),var(--surface2))"><div class="eyebrow">FOUNDATIONS + PLATFORM</div><h2>Machine Learning Associate</h2><p>48 scored questions · 90 minutes · 4 domains · 6+ months recommended hands-on experience</p>${snapshot(associate)}<div class="rule"></div>${button('startexam',`${ic('cert')} Start Associate mock`,'primary')}${button('research',`${ic('external')} Exam guide`,'small',`data-url="${esc(SOURCES[1].url)}"`)}</div><div class="panel" style="background:linear-gradient(155deg,var(--surface),var(--surface2))"><div class="eyebrow">ENTERPRISE-SCALE MLOPS</div><h2>Machine Learning Professional</h2><p>59 scored questions · 120 minutes · 3 domains · 1+ year recommended hands-on experience</p>${snapshot(professional)}<div class="rule"></div>${button('startproexam',`${ic('cert')} Start Professional mock`,'primary')}${button('research',`${ic('external')} Exam guide`,'small',`data-url="${esc(SOURCES[3].url)}"`)}</div></div>${P.quiz?`<div class="panel" style="margin-top:16px;border-color:var(--accent)"><h3>Active session saved</h3><p>Your ${esc(P.quiz.mode)} has ${P.quiz.items.length} questions and can be resumed.</p>${button('resumequiz','Resume active session','primary')}</div>`:''}<div class="section"><h2>Associate blueprint</h2>${tag('38 / 19 / 31 / 12%','purple')}</div>${domainPanel(DOMAINS)}<div class="section"><h2>Professional blueprint</h2>${tag('44 / 44 / 12%','purple')}</div>${domainPanel(PRO_DOMAINS)}<div class="section"><h2>Priority lessons for both certifications</h2></div><div class="module-list">${COURSE.filter(m=>['23','24','25','26','22','27','28','31','32','33','34','35','36','37'].includes(m.id)).map(moduleCard).join('')}</div><div class="section"><h2>Exam preparation guidelines</h2></div><div class="panel"><p class="subtle">Official pages checked November 2026: Associate 48 scored questions / 90 minutes; Professional 59 scored questions / 120 minutes, plus up to 10 unscored items. Both cost USD 200 plus taxes, require no formal prerequisite and are valid for two years. Professional is offered in English. The guide PDF was reissued August 2026 while its version dates remain 2025. Check the official guide around two weeks before your exam. An 80% overall / 70% per-domain threshold in this app is only a personal practice target.</p><div class="two-actions"><a href="${SOURCES[0].url}" class="btn small" target="_blank" rel="noopener noreferrer">Associate official page ${ic('external')}</a><a href="${SOURCES[2].url}" class="btn small" target="_blank" rel="noopener noreferrer">Professional official page ${ic('external')}</a></div></div>${associate.length||professional.length?`<div class="section"><h2>Recent mock attempts</h2></div><div class="panel">${P.sessions.filter(x=>x.mode.startsWith('exam')).slice(0,12).map(a=>`<div class="metric-row"><span>${a.mode==='exam-professional'?'Professional':'Associate'} · ${esc(new Date(a.date).toLocaleDateString('en-US'))}</span><strong>${a.score}/${a.total} · ${pct(a.score,a.total)}%</strong></div>`).join('')}</div>`:''}`}
function roadmap(){return `<div class="eyebrow">A STRUCTURED INTENSIVE ROUTE</div><h1>The 10-week zero-to-hero plan.</h1><p class="lead">Recommended pace: 60–90 minutes per day, six days a week. Mix reading, coding, recall and questions. If you already know the fundamentals, jump to weeks 5–10 and use diagnostics to fill gaps.</p><div class="panel" style="margin-bottom:19px"><h3>Daily learning cycle</h3><div class="plan-cols">${[['20 min','Read and define concepts in English'],['25 min','Implement a code example or lab'],['20 min','Multiple-choice + applied scenarios'],['10 min','Flashcards and error review']].map(([a,b])=>`<div class="plan-card"><h3 style="color:var(--accent2)">${a}</h3><p>${b}</p></div>`).join('')}</div></div><div class="weeklist">${WEEKS.map((w,i)=>{let done=w.ids.filter(id=>modComplete(item(id))).length;return `<div class="panel"><div class="weekrow" style="border:0;padding:0;background:transparent"><div class="weeknum">WEEK ${i+1}</div><div class="weekinfo"><b>${esc(w.name)}</b><span>${esc(w.focus)}</span></div>${tag(`${done}/${w.ids.length} modules`,done===w.ids.length?'green':'')}</div><div style="margin:12px 0">${rowprogress(done,w.ids.length)}</div><div class="two-actions">${w.ids.map(id=>button('module',`Module ${id}`,'small',`data-id="${id}"`)).join('')}</div></div>`}).join('')}</div><div class="section"><h2>Weekly checkpoints</h2></div><div class="panel"><p><strong class="strong">Every week:</strong> aim for at least 15–20 mixed questions a day, complete each selected lab, and explain two new concepts aloud without translating. Every second week, revisit all missed questions. In weeks 8–10, take full-length Associate and Professional mocks on separate days and practice in a live Databricks environment where available.</p><p class="tiny">The schedule is a self-study recommendation. Practice quality and hands-on experience matter more than simply finishing each checkbox.</p></div>`}
function webLink(type,term){const q=encodeURIComponent(term||'machine learning');switch(type){case'kaggle':return `https://www.kaggle.com/search?q=${q}`;case'github':return `https://github.com/search?q=${q}&type=repositories`;case'docs':return `https://www.google.com/search?q=${encodeURIComponent('site:docs.databricks.com '+(term||''))}`;case'sklearn':return `https://www.google.com/search?q=${encodeURIComponent('site:scikit-learn.org/stable '+(term||''))}`;case'papers':return `https://scholar.google.com/scholar?q=${q}`;default:return `https://www.google.com/search?q=${q}`}}
function resources(){const types=['All',...new Set(SOURCES.map(x=>x.type))],filtered=SOURCES.filter(x=>UI.sourceType==='All'||x.type===UI.sourceType);return `<div class="eyebrow">LINKS TO CURRENT, REAL-WORLD MATERIAL</div><h1>Research like a working ML engineer.</h1><p class="lead">Jump directly to Kaggle projects, open-source code, paper search and up-to-date official documentation. External links need an internet connection; the app does not scrape search results or execute notebooks.</p><div class="panel" style="margin-bottom:19px"><h2>Search the web for an example</h2><div class="quiz-grid"><div class="field"><label>What are you studying?</label><input id="webquery" class="input" value="${esc(UI.webQuery)}" placeholder="e.g. MLflow champion alias, time series CV"/></div><div class="field"><label>Where should we search?</label><select id="websource" class="select">${[['docs','Databricks official docs'],['kaggle','Kaggle notebooks & datasets'],['github','GitHub repositories'],['sklearn','scikit-learn documentation'],['papers','Google Scholar'],['google','General web search']].map(([key,label])=>`<option value="${key}" ${UI.webSource===key?'selected':''}>${label}</option>`).join('')}</select></div></div><div style="margin-top:16px" class="two-actions">${button('websearch',`${ic('search')} Search in new tab`,'primary')}${button('research','Search this module','',`data-text="${esc(item(UI.module)?.title||'Databricks MLflow')}"`)}</div></div><div class="section"><h2>Curated official references</h2></div><div class="toolbar"><select class="select" id="sourcefilter">${types.map(t=>`<option value="${esc(t)}" ${UI.sourceType===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="resource-grid">${filtered.map(s=>`<div class="resource-card"><div class="module-head">${tag(s.type,'purple')}${ic('external')}</div><b style="margin-top:9px">${esc(s.name)}</b><p>${esc(s.description)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Open resource ${ic('arrow')}</a></div>`).join('')}</div><div class="section"><h2>English interview practice</h2>${tag('12 verbal prompts')}</div><p class="subtle">Practice answering each question aloud in English, then open the reference response. Use your own project examples to make the terms natural.</p><div class="review-answers" style="max-height:none">${INTERVIEWS.map((t,i)=>`<details><summary>${i+1}. ${esc(t.q)}</summary><p>${esc(t.a)}</p></details>`).join('')}</div>`}
function searchResults(){const query=(UI.search||'').trim(),text=query.toLowerCase();if(!query)return `<div class="empty"><h3>Search the course</h3><p>Enter a concept, algorithm, library or real-world use case in the search bar.</p></div>`;const mm=COURSE.filter(m=>[m.title,m.summary,m.code,m.lab.task,...m.concepts.map(c=>c.term)].join(' ').toLowerCase().includes(text)),cc=allConcepts.filter(c=>[c.term,c.definition,c.example].join(' ').toLowerCase().includes(text));return `<div class="eyebrow">SEARCH RESULTS</div><h1>Results for “${esc(query)}”</h1><p class="lead">${mm.length} matching modules · ${cc.length} matching concepts.</p><div class="section"><h2>Learning modules</h2></div><div class="module-list">${mm.map(moduleCard).join('')}</div><div class="section"><h2>Concept dictionary matches</h2></div><div class="glossary-list">${cc.map(c=>`<div class="glossary-item"><strong>${esc(c.term)}</strong><p>${esc(c.definition)}</p>${button('module','Read full lesson','small',`data-id="${c.module}"`)}</div>`).join('')}</div>${!mm.length&&!cc.length?`<div class="empty"><p>Try a related technical term, or search the internet.</p>${button('research','Search official documentation','primary',`data-text="${esc(query)}"`)}</div>`:''}`}
function settings(){return `<div class="eyebrow">LOCAL-FIRST & PRIVACY-FRIENDLY</div><h1>Your learning preferences.</h1><p class="lead">Everything is saved locally in this browser. No account or external service is required to study. Export a JSON file to move progress between Android and PC.</p><div class="panel" style="max-width:750px"><h2>Study goals</h2><div class="field"><label for="dailygoal">Daily practice question target</label><select id="dailygoal" class="select"><option value="5" ${P.goal===5?'selected':''}>5 questions per day</option><option value="10" ${P.goal===10?'selected':''}>10 questions per day</option><option value="15" ${P.goal===15?'selected':''}>15 questions per day</option><option value="20" ${P.goal===20?'selected':''}>20 questions per day</option><option value="30" ${P.goal===30?'selected':''}>30 questions per day</option></select></div><div class="rule"></div><h2>Backup & portability</h2><p class="subtle">Export includes your completed readings, notes, lab checkoffs, flashcard reviews, question accuracy, history, and any unfinished session. Treat the backup as private.</p><div class="two-actions">${button('export',`${ic('download')} Export progress (.json)`,'primary')}${button('import',`${ic('upload')} Import progress`,'')}<input id="importfile" type="file" accept=".json,application/json" hidden/></div><div class="rule"></div><h2>Local reset</h2><p class="subtle">This clears only the browser's local study records. Download a backup first if you want to retain your results.</p>${button('reset',`${ic('trash')} Clear local progress`,'danger')}<div class="rule"></div><h2>Install on your device</h2><p class="subtle">Android Chrome: when the site is hosted on HTTPS, open the browser menu → Install app / Add to Home screen. PC Chrome/Edge: use the install icon in the address bar. Local file viewing works, but offline PWA installation requires hosting on HTTPS or localhost.</p>${button('install',`${ic('download')} Install this app`,'')}
<div class="rule"></div><h2>What this app can and cannot do</h2><p class="subtle">Works offline after being installed and initially cached. Its built-in questions and course content work without internet. Online research opens external sites. Coding labs are self-checked: the browser does not execute Python, Spark, or MLflow. Device progress does not automatically synchronize; use export/import.</p></div>`}
function render(){document.body.classList.toggle('light',P.theme==='light');document.getElementById('app').innerHTML=shell()}
function downloadBackup(){const blob=new Blob([JSON.stringify({app:'ML Compass',version:VERSION,exportedAt:new Date().toISOString(),progress:P},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ml-compass-backup-${dateKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Backup downloaded.')}
function importBackup(file){if(!file)return;file.text().then(text=>{let data;try{data=JSON.parse(text)}catch(e){toast('That file is not valid JSON.');return}const next=data?.progress||data;if(next?.schema!==1||typeof next.concepts!=='object'||!Array.isArray(next.sessions)){toast('This is not a compatible ML Compass backup.');return}if(!confirm('Replace the progress on this device with the imported backup?'))return;P={...base(),...next};save();UI.results=null;UI.flashKey=null;UI.module=P.lastModule||'01';toast('Progress imported successfully.');navigate('home')}).catch(()=>toast('The file could not be read.'))}
function copyCode(id){const m=item(id.split('-')[0]);if(!m)return;const code=id.endsWith('solution')?m.lab.solution:m.code;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(code).then(()=>toast('Code copied to clipboard.')).catch(()=>toast('Clipboard unavailable: select the code manually.'))}else{const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Code copied to clipboard.':'Select the code manually.') }}
function researchUrl(btn){if(btn.dataset.url)return btn.dataset.url;return webLink('docs',btn.dataset.text||UI.search||'Databricks Machine Learning')}
function toggleTheme(){P.theme=P.theme==='dark'?'light':'dark';save();render()}
const app=document.getElementById('app');
app.addEventListener('click',(e)=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id||'';switch(action){
 case'nav':navigate(el.dataset.page);break;case'menu':UI.menu=!UI.menu;render();break;case'theme':toggleTheme();break;
 case'resume':navigate('module',{module:P.lastModule});break;case'module':navigate('module',{module:id});break;case'lab':navigate('lab',{module:id});break;
 case'quick':{if(P.quiz){navigate('quiz');break}makeQuiz(shuffle(QUESTIONS).slice(0,10).map(q=>q.id));break}
 case'openexam':navigate('cert');break;case'startexam':P.quiz?navigate('quiz'):startExam('associate');break;case'startproexam':P.quiz?navigate('quiz'):startExam('professional');break;
 case'modulequiz':if(P.quiz){navigate('quiz');break}makeQuiz(shuffle(QUESTIONS.filter(q=>q.module===id)).map(q=>q.id));break;
 case'domainquiz':if(P.quiz){navigate('quiz');break}makeQuiz(shuffle(QUESTIONS.filter(q=>q.domain===el.dataset.domain)).slice(0,20).map(q=>q.id));break;
 case'startpractice':P.quiz?navigate('quiz'):startPractice();break;case'missed':if(P.quiz){navigate('quiz');break}{const x=weakQuestions();if(!x.length){toast('No incorrect questions recorded yet.');break}makeQuiz(shuffle(x).map(q=>q.id));break}
 case'resumequiz':navigate('quiz');break;case'quitquiz':navigate(P.quiz?.mode?.startsWith('exam')?'cert':'practice');break;
 case'abandon':if(confirm('Discard this unfinished session? Progress already recorded from individual practice answers will remain.')){P.quiz=null;save();navigate('practice')}break;
 case'selectchoice':choiceSelect(Number(el.dataset.opt));break;case'checkanswer':checkAnswer();break;case'nextquestion':moveQuestion(1);break;case'prevquestion':moveQuestion(-1);break;
 case'read':{const key=el.dataset.key,was=!!P.concepts[key];P.concepts[key]=!was;if(!was){P.xp+=5;bump('read')}save();render();break}
 case'labdone':{const was=!!P.labs[id];P.labs[id]=!was;if(!was){P.xp+=25;bump('labs')}save();render();toast(was?'Lab marked in progress.':'Lab completed.');break}
 case'copycode':copyCode(el.dataset.code);break;case'flip':UI.flashFlipped=!UI.flashFlipped;render();break;case'grade':gradeCard(el.dataset.rating);break;
 case'websearch':{const q=(document.getElementById('webquery')?.value||UI.webQuery||'').trim();UI.webQuery=q;window.open(webLink(UI.webSource,q||'machine learning'),'_blank','noopener,noreferrer');break}
 case'research':window.open(researchUrl(el),'_blank','noopener,noreferrer');break;case'export':downloadBackup();break;case'import':document.getElementById('importfile')?.click();break;
 case'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(()=>deferredInstall=null)}else toast('Use the browser menu → Install app / Add to Home screen on HTTPS.');break;
 case'reset':if(confirm('Delete ALL study progress stored in this browser? This cannot be undone without a backup.')){P=base();save();UI.module='01';UI.results=null;UI.flashKey=null;toast('Local study progress reset.');navigate('home')}break;
 }});
app.addEventListener('keydown',(e)=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&e.target.id==='global-search'){UI.search=e.target.value.trim();navigate('search',{search:UI.search})}if(e.key==='Enter'&&e.target.id==='webquery'){UI.webQuery=e.target.value;window.open(webLink(UI.webSource,UI.webQuery),'_blank','noopener,noreferrer')}});
app.addEventListener('change',(e)=>{const el=e.target;switch(el.id){case'trackfilter':UI.track=el.value;render();break;case'quizdomain':UI.setupDomain=el.value;break;case'quizkind':UI.setupKind=el.value;break;case'quizcount':UI.setupCount=el.value;break;case'sourcefilter':UI.sourceType=el.value;render();break;case'websource':UI.webSource=el.value;break;case'dailygoal':P.goal=Number(el.value);save();toast('Daily goal updated.');break;case'importfile':importBackup(el.files[0]);break;}});
app.addEventListener('input',(e)=>{const el=e.target;switch(el.id){case'global-search':UI.search=el.value;break;case'libsearch':UI.libSearch=el.value;{const pos=el.selectionStart;render();const n=document.getElementById('libsearch');n?.focus();n?.setSelectionRange(pos,pos)}break;case'labsearch':UI.labSearch=el.value;{const pos=el.selectionStart;render();const n=document.getElementById('labsearch');n?.focus();n?.setSelectionRange(pos,pos)}break;case'wordsearch':UI.wordSearch=el.value;{const pos=el.selectionStart;render();const n=document.getElementById('wordsearch');n?.focus();n?.setSelectionRange(pos,pos)}break;case'webquery':UI.webQuery=el.value;break;case'labnotes':P.notes[el.dataset.id]=el.value;save();break;}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('visibilitychange',()=>{if(!document.hidden&&P.quiz?.mode?.startsWith('exam')&&Date.now()>=P.quiz.deadline){finishQuiz()}});
setInterval(()=>{if(!P.quiz||!P.quiz.mode.startsWith('exam'))return;const e=document.getElementById('exam-timer');if(e)e.innerHTML=ic('clock')+' '+timeLeft(P.quiz.deadline);if(Date.now()>=P.quiz.deadline)finishQuiz()},1000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
if(P.quiz?.mode?.startsWith('exam')&&Date.now()>=P.quiz.deadline)finishQuiz();else render();

</script></body></html>
